<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Plumber Bros - World 1-1</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        background-color: #18181b;
        color: #fff;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        border: 4px solid #3f3f46;
        border-radius: 8px;
        overflow: hidden;
        background: #5c94fc;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #hud {
        position: absolute;
        top: 14px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
        letter-spacing: 1px;
      }
      .hud-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hud-label {
        font-size: 13px;
        color: #fde047;
      }
      #overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      #overlay h1 {
        font-size: 42px;
        color: #ef4444;
        text-shadow:
          3px 3px 0 #000,
          -1px -1px 0 #fde047;
        margin-bottom: 12px;
        letter-spacing: 2px;
      }
      #overlay p {
        font-size: 16px;
        max-width: 480px;
        line-height: 1.5;
        margin-bottom: 24px;
        color: #e4e4e7;
      }
      #start-btn {
        background: #22c55e;
        color: #fff;
        border: 3px solid #fff;
        padding: 12px 32px;
        font-size: 20px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
        text-shadow: 2px 2px 0 #000;
        box-shadow: 0 5px 0 #15803d;
        transition: transform 0.08s;
      }
      #start-btn:hover {
        background: #16a34a;
      }
      #start-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #15803d;
      }
      #controls-bar {
        margin-top: 12px;
        font-size: 14px;
        color: #a1a1aa;
        display: flex;
        gap: 20px;
      }
      .key {
        background: #27272a;
        border: 1px solid #52525b;
        padding: 2px 8px;
        border-radius: 4px;
        color: #f4f4f5;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="800" height="480"></canvas>
      <div id="hud">
        <div class="hud-item">
          <span class="hud-label">SCORE</span>
          <span id="score-val">000000</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">COINS</span>
          <span id="coins-val">x00</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">WORLD</span>
          <span>1-1</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">TIME</span>
          <span id="time-val">090</span>
        </div>
      </div>
      <div id="overlay">
        <h1 id="overlay-title">SUPER PLUMBER 1-1</h1>
        <p id="overlay-desc">Run, jump, smash bricks, grab the Super Mushroom, stomp Goombas, and reach the flagpole!</p>
        <button id="start-btn">START GAME</button>
      </div>
    </div>

    <div id="controls-bar">
      <span><span class="key">A / D</span> or <span class="key">◀ / ▶</span> Move</span>
      <span><span class="key">W</span> / <span class="key">SPACE</span> / <span class="key">▲</span> Jump (Hold for higher)</span>
      <span><span class="key">SHIFT</span> Sprint</span>
      <span><span class="key">R</span> Restart</span>
    </div>

    <script>
      ;(() => {
        const canvas = document.getElementById("gameCanvas")
        const ctx = canvas.getContext("2d")
        const overlay = document.getElementById("overlay")
        const overlayTitle = document.getElementById("overlay-title")
        const overlayDesc = document.getElementById("overlay-desc")
        const startBtn = document.getElementById("start-btn")

        const scoreEl = document.getElementById("score-val")
        const coinsEl = document.getElementById("coins-val")
        const timeEl = document.getElementById("time-val")

        // --- Web Audio Retro Synthesizer ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext
        let audioCtx = null

        function initAudio() {
          if (!audioCtx) audioCtx = new AudioCtx()
          if (audioCtx.state === "suspended") audioCtx.resume()
        }

        function playTone(freq, type, duration, vol = 0.12, slideFreq = null) {
          if (!audioCtx) return
          const osc = audioCtx.createOscillator()
          const gain = audioCtx.createGain()
          osc.type = type
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime)
          if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration)
          }
          gain.gain.setValueAtTime(vol, audioCtx.currentTime)
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration)
          osc.connect(gain)
          gain.connect(audioCtx.destination)
          osc.start()
          osc.stop(audioCtx.currentTime + duration)
        }

        const sfx = {
          jump: () => playTone(240, "square", 0.18, 0.1, 560),
          bigJump: () => playTone(180, "square", 0.22, 0.1, 480),
          coin: () => {
            playTone(987.77, "square", 0.08, 0.1)
            setTimeout(() => playTone(1318.51, "square", 0.25, 0.1), 70)
          },
          stomp: () => playTone(160, "sawtooth", 0.12, 0.14, 60),
          bump: () => playTone(110, "triangle", 0.1, 0.15, 70),
          breakBrick: () => {
            playTone(140, "square", 0.08, 0.14, 55)
            setTimeout(() => playTone(100, "sawtooth", 0.09, 0.12, 40), 40)
          },
          powerupAppear: () => {
            ;[330, 392, 659, 523, 587, 784].forEach((f, i) => {
              setTimeout(() => playTone(f, "square", 0.08, 0.09), i * 55)
            })
          },
          powerup: () => {
            ;[392, 523, 659, 784, 659, 1046].forEach((f, i) => {
              setTimeout(() => playTone(f, "triangle", 0.09, 0.12), i * 55)
            })
          },
          shrink: () => {
            ;[520, 420, 320, 220].forEach((f, i) => {
              setTimeout(() => playTone(f, "sawtooth", 0.08, 0.11), i * 60)
            })
          },
          die: () => {
            ;[493, 698, 698, 698, 659, 587, 523].forEach((f, i) => {
              setTimeout(() => playTone(f, "square", 0.12, 0.11), i * 110)
            })
          },
          win: () => {
            ;[523, 659, 784, 1046, 784, 1046].forEach((f, i) => {
              setTimeout(() => playTone(f, "square", i === 5 ? 0.4 : 0.11, 0.11), i * 120)
            })
          }
        }

        // --- Constants & Level Design ---
        const TILE = 32
        const GRAVITY = 0.58
        const MAX_FALL = 12

        // Legend:
        // 'G' = Ground top, 'D' = Dirt sub-ground
        // 'B' = Brick, '?' = Coin Q-Block, 'M' = Mushroom Q-Block, 'S' = Solid Stone Block
        // '[' / ']' = Pipe Top Left/Right, '{' / '}' = Pipe Body Left/Right
        // 'C' = Floating Coin, 'E' = Goomba Enemy, 'F' = Flagpole, 'K' = Castle
        const LEVEL_ROWS = [
          "                                                                                                                                              ",
          "                                                                                                                                              ",
          "                                                                                                                                              ",
          "                                                                             C C C                                                            ",
          "                                                                           B B B B B                                                          ",
          "                                       B ? B                                                                                                  ",
          "                                                                                                  S S                                 F       ",
          "                                                                   C C                           S S S                                |       ",
          "                     ?     B M B                  [ ]            B ? B          E               S S S S                               |       ",
          "                                                  { }                          S S             S S S S S                              |       ",
          "                                       [ ]        { }                         S S S           S S S S S S                K K K        |       ",
          "               C C                     { }   E    { }     E   E              S S S S   E     S S S S S S S               K K K        |       ",
          "             B ? B         E           { }        { }                      S S S S S       S S S S S S S S               K K K        S       ",
          "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
          "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD   DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD   DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD"
        ]

        const LEVEL_HEIGHT = LEVEL_ROWS.length
        const LEVEL_WIDTH = LEVEL_ROWS[0].length

        // --- Game State ---
        let gameState = "START" // START, PLAYING, WIN, GAMEOVER
        let score = 0
        let coins = 0
        let timeLeft = 90
        let timeTimer = 0
        let cameraX = 0
        let frameCount = 0

        let tiles = []
        let enemies = []
        let items = []
        let particles = []
        let floatingTexts = []
        let flagpole = null
        let castle = null

        const keys = {}
        window.addEventListener("keydown", (e) => {
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
            e.preventDefault()
          }
          keys[e.code] = true
          if (e.code === "KeyR" && gameState !== "START") {
            resetGame()
          }
        })
        window.addEventListener("keyup", (e) => {
          keys[e.code] = false
        })

        // --- Player Object ---
        const player = {
          x: 80,
          y: 300,
          w: 24,
          h: 30,
          vx: 0,
          vy: 0,
          big: false,
          invuln: 0,
          grounded: false,
          facing: 1,
          animTimer: 0,
          animFrame: 0,
          jumpHeld: false,
          jumpTimer: 0,
          dead: false,
          winSlide: false
        }

        function addScore(pts, x, y) {
          score += pts
          scoreEl.textContent = String(score).padStart(6, "0")
          if (x !== undefined && y !== undefined) {
            floatingTexts.push({ x, y, text: "+" + pts, life: 45 })
          }
        }

        function addCoin(x, y) {
          coins++
          coinsEl.textContent = "x" + String(coins).padStart(2, "0")
          addScore(200, x, y)
          sfx.coin()
        }

        function spawnParticles(x, y, color, count = 6) {
          for (let i = 0; i < count; i++) {
            particles.push({
              x,
              y,
              vx: (Math.random() - 0.5) * 6,
              vy: -Math.random() * 6 - 2,
              size: 5 + Math.random() * 4,
              color,
              life: 35
            })
          }
        }

        function buildLevel() {
          tiles = []
          enemies = []
          items = []
          particles = []
          floatingTexts = []
          flagpole = null
          castle = null

          for (let r = 0; r < LEVEL_HEIGHT; r++) {
            tiles[r] = []
            for (let c = 0; c < LEVEL_WIDTH; c++) {
              const ch = LEVEL_ROWS[r][c]
              tiles[r][c] = null

              if ("GDB?MS[]{}".includes(ch)) {
                tiles[r][c] = {
                  type: ch,
                  used: false,
                  bumpY: 0,
                  bumpVy: 0
                }
              } else if (ch === "C") {
                items.push({
                  type: "coin",
                  x: c * TILE + 8,
                  y: r * TILE + 6,
                  w: 16,
                  h: 20,
                  vx: 0,
                  vy: 0,
                  collected: false
                })
              } else if (ch === "E") {
                enemies.push({
                  type: "goomba",
                  x: c * TILE + 2,
                  y: r * TILE + 4,
                  w: 28,
                  h: 28,
                  vx: -1.1,
                  vy: 0,
                  dead: false,
                  squishTimer: 0
                })
              } else if (ch === "F") {
                flagpole = {
                  x: c * TILE + 14,
                  topY: r * TILE,
                  bottomY: 13 * TILE,
                  flagY: r * TILE + 12
                }
              } else if (ch === "K" && !castle) {
                castle = {
                  x: c * TILE,
                  y: r * TILE,
                  w: TILE * 3,
                  h: TILE * 3
                }
              }
            }
          }
        }

        function resetGame() {
          initAudio()
          score = 0
          coins = 0
          timeLeft = 90
          timeTimer = 0
          cameraX = 0
          scoreEl.textContent = "000000"
          coinsEl.textContent = "x00"
          timeEl.textContent = "090"

          player.x = 80
          player.y = 320
          player.w = 24
          player.h = 30
          player.vx = 0
          player.vy = 0
          player.big = false
          player.invuln = 0
          player.grounded = false
          player.facing = 1
          player.dead = false
          player.winSlide = false

          buildLevel()
          gameState = "PLAYING"
          overlay.style.display = "none"
        }

        startBtn.addEventListener("click", resetGame)

        // --- Collision Helpers ---
        function isSolid(r, c) {
          if (r < 0) return false
          if (r >= LEVEL_HEIGHT) return false
          if (c < 0 || c >= LEVEL_WIDTH) return true
          return tiles[r][c] !== null
        }

        function rectIntersect(a, b) {
          return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y
        }

        function hitBlock(r, c) {
          const t = tiles[r][c]
          if (!t) return

          if (t.type === "?" && !t.used) {
            t.used = true
            t.bumpVy = -5
            addCoin(c * TILE + 8, r * TILE - 12)
            spawnParticles(c * TILE + 16, r * TILE, "#fde047", 5)
          } else if (t.type === "M" && !t.used) {
            t.used = true
            t.bumpVy = -5
            sfx.powerupAppear()
            items.push({
              type: "mushroom",
              x: c * TILE + 4,
              y: r * TILE - 26,
              w: 24,
              h: 26,
              vx: 1.5,
              vy: -2,
              collected: false
            })
          } else if (t.type === "B") {
            if (player.big) {
              tiles[r][c] = null
              sfx.breakBrick()
              addScore(50)
              spawnParticles(c * TILE + 16, r * TILE + 16, "#b45309", 10)
            } else {
              t.bumpVy = -4
              sfx.bump()
            }
          } else {
            sfx.bump()
          }
        }

        function moveEntity(ent, isPlayer = false) {
          // Horizontal
          ent.x += ent.vx
          let leftCol = Math.floor(ent.x / TILE)
          let rightCol = Math.floor((ent.x + ent.w - 0.01) / TILE)
          let topRow = Math.floor(ent.y / TILE)
          let bottomRow = Math.floor((ent.y + ent.h - 0.01) / TILE)

          for (let r = topRow; r <= bottomRow; r++) {
            if (ent.vx < 0 && isSolid(r, leftCol)) {
              ent.x = (leftCol + 1) * TILE
              if (isPlayer) ent.vx = 0
              else ent.vx = -ent.vx
              break
            } else if (ent.vx > 0 && isSolid(r, rightCol)) {
              ent.x = rightCol * TILE - ent.w
              if (isPlayer) ent.vx = 0
              else ent.vx = -ent.vx
              break
            }
          }

          // Vertical
          ent.vy = Math.min(ent.vy + GRAVITY, MAX_FALL)
          ent.y += ent.vy
          ent.grounded = false

          leftCol = Math.floor(ent.x / TILE)
          rightCol = Math.floor((ent.x + ent.w - 0.01) / TILE)
          topRow = Math.floor(ent.y / TILE)
          bottomRow = Math.floor((ent.y + ent.h - 0.01) / TILE)

          if (ent.vy > 0) {
            for (let c = leftCol; c <= rightCol; c++) {
              if (isSolid(bottomRow, c)) {
                ent.y = bottomRow * TILE - ent.h
                ent.vy = 0
                ent.grounded = true
                break
              }
            }
          } else if (ent.vy < 0) {
            for (let c = leftCol; c <= rightCol; c++) {
              if (isSolid(topRow, c)) {
                ent.y = (topRow + 1) * TILE
                ent.vy = 0
                if (isPlayer) {
                  const centerCol = Math.floor((ent.x + ent.w / 2) / TILE)
                  if (isSolid(topRow, centerCol)) hitBlock(topRow, centerCol)
                  else hitBlock(topRow, c)
                }
                break
              }
            }
          }
        }

        function triggerGameOver(reason) {
          if (gameState !== "PLAYING") return
          gameState = "GAMEOVER"
          player.dead = true
          player.vy = -10
          sfx.die()
          setTimeout(() => {
            overlayTitle.textContent = "GAME OVER"
            overlayTitle.style.color = "#ef4444"
            overlayDesc.textContent = reason + " Final Score: " + score
            startBtn.textContent = "TRY AGAIN"
            overlay.style.display = "flex"
          }, 1100)
        }

        function triggerWin() {
          if (gameState !== "PLAYING") return
          gameState = "WIN"
          player.winSlide = true
          player.vx = 0
          player.vy = 0
          const heightBonus = Math.max(100, Math.round((flagpole.bottomY - player.y) * 5))
          const timeBonus = timeLeft * 50
          addScore(heightBonus + timeBonus, player.x, player.y - 20)
          sfx.win()

          setTimeout(() => {
            overlayTitle.textContent = "COURSE CLEAR!"
            overlayTitle.style.color = "#fde047"
            overlayDesc.textContent = `Awesome job! Time Bonus: +${timeBonus} | Total Score: ${score}`
            startBtn.textContent = "PLAY AGAIN"
            overlay.style.display = "flex"
          }, 1600)
        }

        // --- Update Loop ---
        function update() {
          frameCount++

          // Update Tile Bumps
          for (let r = 0; r < LEVEL_HEIGHT; r++) {
            for (let c = 0; c < LEVEL_WIDTH; c++) {
              const t = tiles[r][c]
              if (t && (t.bumpY !== 0 || t.bumpVy !== 0)) {
                t.bumpY += t.bumpVy
                t.bumpVy += 0.8
                if (t.bumpY >= 0) {
                  t.bumpY = 0
                  t.bumpVy = 0
                }
              }
            }
          }

          // Update Particles & Floating Texts
          particles.forEach((p) => {
            p.x += p.vx
            p.y += p.vy
            p.vy += 0.35
            p.life--
          })
          particles = particles.filter((p) => p.life > 0)

          floatingTexts.forEach((ft) => {
            ft.y -= 0.8
            ft.life--
          })
          floatingTexts = floatingTexts.filter((ft) => ft.life > 0)

          if (gameState === "GAMEOVER") {
            player.vy += GRAVITY * 0.7
            player.y += player.vy
            return
          }

          if (gameState === "WIN") {
            if (flagpole && flagpole.flagY < flagpole.bottomY - 28) {
              flagpole.flagY += 4
            }
            if (player.y + player.h < flagpole.bottomY) {
              player.y += 3
            } else {
              player.vx = 2.2
              player.facing = 1
              moveEntity(player, false)
            }
            return
          }

          if (gameState !== "PLAYING") return

          // Timer
          timeTimer++
          if (timeTimer >= 60) {
            timeTimer = 0
            timeLeft--
            timeEl.textContent = String(Math.max(0, timeLeft)).padStart(3, "0")
            if (timeLeft <= 0) {
              triggerGameOver("Time's up!")
              return
            }
          }

          if (player.invuln > 0) player.invuln--

          // Player Controls
          const left = keys["ArrowLeft"] || keys["KeyA"]
          const right = keys["ArrowRight"] || keys["KeyD"]
          const jump = keys["Space"] || keys["ArrowUp"] || keys["KeyW"]
          const sprint = keys["ShiftLeft"] || keys["ShiftRight"]

          const maxSpeed = sprint ? 5.2 : 3.5
          const accel = player.grounded ? 0.38 : 0.24
          const friction = player.grounded ? 0.82 : 0.94

          if (left) {
            player.vx = Math.max(player.vx - accel, -maxSpeed)
            player.facing = -1
          } else if (right) {
            player.vx = Math.min(player.vx + accel, maxSpeed)
            player.facing = 1
          } else {
            player.vx *= friction
            if (Math.abs(player.vx) < 0.1) player.vx = 0
          }

          // Variable height jump
          if (jump && player.grounded && !player.jumpHeld) {
            player.vy = -10.8
            player.grounded = false
            player.jumpHeld = true
            player.jumpTimer = 12
            player.big ? sfx.bigJump() : sfx.jump()
          } else if (jump && player.jumpHeld && player.jumpTimer > 0 && player.vy < 0) {
            player.vy -= 0.42
            player.jumpTimer--
          }
          if (!jump) {
            player.jumpHeld = false
            player.jumpTimer = 0
          }

          moveEntity(player, true)

          // Prevent walking backwards off camera
          if (player.x < cameraX) {
            player.x = cameraX
            player.vx = 0
          }

          // Pit death
          if (player.y > canvas.height + 30) {
            triggerGameOver("You fell into a pit!")
            return
          }

          // Animation cycle
          if (Math.abs(player.vx) > 0.3 && player.grounded) {
            player.animTimer += Math.abs(player.vx) * 0.08
            player.animFrame = Math.floor(player.animTimer) % 3
          } else {
            player.animFrame = 0
          }

          // Smooth Camera Follow
          const targetCam = player.x - canvas.width * 0.38
          if (targetCam > cameraX) {
            cameraX = Math.min(targetCam, LEVEL_WIDTH * TILE - canvas.width)
          }

          // Update Items (Coins & Mushrooms)
          items.forEach((item) => {
            if (item.collected) return
            if (item.type === "mushroom") {
              moveEntity(item, false)
            }
            if (rectIntersect(player, item)) {
              item.collected = true
              if (item.type === "coin") {
                addCoin(item.x, item.y)
                spawnParticles(item.x + 8, item.y + 8, "#fde047", 4)
              } else if (item.type === "mushroom") {
                sfx.powerup()
                addScore(1000, item.x, item.y)
                if (!player.big) {
                  player.big = true
                  player.y -= 14
                  player.h = 44
                }
              }
            }
          })
          items = items.filter((i) => !i.collected)

          // Update Enemies
          enemies.forEach((en) => {
            if (en.dead) {
              en.squishTimer--
              return
            }
            // Activate enemy when near camera
            if (en.x > cameraX + canvas.width + 120) return

            moveEntity(en, false)

            if (rectIntersect(player, en)) {
              const playerBottomPrev = player.y + player.h - player.vy
              if (player.vy > 0 && playerBottomPrev <= en.y + 14) {
                // Stomp Goomba!
                en.dead = true
                en.squishTimer = 25
                player.vy = -8.2
                sfx.stomp()
                addScore(100, en.x, en.y - 10)
                spawnParticles(en.x + 14, en.y + 14, "#92400e", 6)
              } else if (player.invuln === 0) {
                if (player.big) {
                  player.big = false
                  player.h = 30
                  player.y += 14
                  player.invuln = 90
                  sfx.shrink()
                } else {
                  triggerGameOver("Hit by a Goomba!")
                }
              }
            }
          })
          enemies = enemies.filter((en) => !(en.dead && en.squishTimer <= 0) && en.y < canvas.height + 60)

          // Check Flagpole Win
          if (flagpole && player.x + player.w >= flagpole.x) {
            triggerWin()
          }
        }

        // --- Rendering ---
        function drawBackground() {
          // Sky gradient
          const grad = ctx.createLinearGradient(0, 0, 0, canvas.height)
          grad.addColorStop(0, "#3b82f6")
          grad.addColorStop(1, "#93c5fd")
          ctx.fillStyle = grad
          ctx.fillRect(0, 0, canvas.width, canvas.height)

          // Parallax Hills
          ctx.fillStyle = "#16a34a"
          for (let i = 0; i < 12; i++) {
            const hx = ((i * 380 - cameraX * 0.25) % (12 * 380 + 200)) - 100
            const hy = 416
            ctx.beginPath()
            ctx.arc(hx, hy, 95, Math.PI, 0)
            ctx.fill()
          }

          // Parallax Clouds
          ctx.fillStyle = "rgba(255, 255, 255, 0.88)"
          for (let i = 0; i < 15; i++) {
            const cx = ((i * 290 - cameraX * 0.15) % (15 * 290 + 200)) - 80
            const cy = 60 + (i % 3) * 35
            ctx.beginPath()
            ctx.arc(cx, cy, 20, 0, Math.PI * 2)
            ctx.arc(cx + 22, cy - 6, 25, 0, Math.PI * 2)
            ctx.arc(cx + 46, cy, 20, 0, Math.PI * 2)
            ctx.fill()
          }
        }

        function drawTiles() {
          const startCol = Math.max(0, Math.floor(cameraX / TILE))
          const endCol = Math.min(LEVEL_WIDTH - 1, Math.ceil((cameraX + canvas.width) / TILE))

          for (let r = 0; r < LEVEL_HEIGHT; r++) {
            for (let c = startCol; c <= endCol; c++) {
              const t = tiles[r][c]
              if (!t) continue
              const x = c * TILE
              const y = r * TILE + t.bumpY

              if (t.type === "G") {
                ctx.fillStyle = "#b45309"
                ctx.fillRect(x, y, TILE, TILE)
                ctx.fillStyle = "#22c55e"
                ctx.fillRect(x, y, TILE, 8)
                ctx.fillStyle = "#15803d"
                ctx.fillRect(x, y + 8, TILE, 3)
              } else if (t.type === "D") {
                ctx.fillStyle = "#92400e"
                ctx.fillRect(x, y, TILE, TILE)
                ctx.fillStyle = "#78350f"
                ctx.fillRect(x + 4, y + 6, 8, 8)
                ctx.fillRect(x + 18, y + 18, 8, 8)
              } else if (t.type === "B") {
                ctx.fillStyle = "#c2410c"
                ctx.fillRect(x, y, TILE, TILE)
                ctx.strokeStyle = "#431407"
                ctx.lineWidth = 2
                ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2)
                ctx.beginPath()
                ctx.moveTo(x, y + 16)
                ctx.lineTo(x + TILE, y + 16)
                ctx.moveTo(x + 16, y)
                ctx.lineTo(x + 16, y + 16)
                ctx.moveTo(x + 8, y + 16)
                ctx.lineTo(x + 8, y + TILE)
                ctx.stroke()
              } else if (t.type === "?" || t.type === "M") {
                ctx.fillStyle = t.used ? "#78716c" : "#f59e0b"
                ctx.fillRect(x, y, TILE, TILE)
                ctx.strokeStyle = "#451a03"
                ctx.lineWidth = 2
                ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2)
                if (!t.used) {
                  ctx.fillStyle = "#fef08a"
                  ctx.font = "bold 20px Courier New"
                  ctx.fillText("?", x + 10, y + 23)
                }
              } else if (t.type === "S") {
                ctx.fillStyle = "#64748b"
                ctx.fillRect(x, y, TILE, TILE)
                ctx.fillStyle = "#94a3b8"
                ctx.fillRect(x + 2, y + 2, TILE - 4, 4)
                ctx.strokeStyle = "#1e293b"
                ctx.lineWidth = 2
                ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2)
              } else if ("[]{}".includes(t.type)) {
                ctx.fillStyle = "#16a34a"
                ctx.fillRect(x, y, TILE, TILE)
                ctx.fillStyle = "#4ade80"
                ctx.fillRect(x + 4, y, 6, TILE)
                ctx.strokeStyle = "#052e16"
                ctx.lineWidth = 2
                ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2)
              }
            }
          }
        }

        function drawProps() {
          // Castle
          if (castle) {
            ctx.fillStyle = "#94a3b8"
            ctx.fillRect(castle.x, castle.y, castle.w, castle.h)
            // Battlements
            for (let i = 0; i < 5; i++) {
              ctx.fillRect(castle.x + i * 20, castle.y - 12, 12, 12)
            }
            // Door
            ctx.fillStyle = "#1e293b"
            ctx.beginPath()
            ctx.arc(castle.x + castle.w / 2, castle.y + castle.h - 24, 16, Math.PI, 0)
            ctx.fillRect(castle.x + castle.w / 2 - 16, castle.y + castle.h - 24, 32, 24)
            ctx.fill()
          }

          // Flagpole
          if (flagpole) {
            ctx.fillStyle = "#e2e8f0"
            ctx.fillRect(flagpole.x, flagpole.topY, 5, flagpole.bottomY - flagpole.topY)
            // Finial ball
            ctx.fillStyle = "#fde047"
            ctx.beginPath()
            ctx.arc(flagpole.x + 2.5, flagpole.topY, 7, 0, Math.PI * 2)
            ctx.fill()
            // Flag triangle
            ctx.fillStyle = "#ef4444"
            ctx.beginPath()
            ctx.moveTo(flagpole.x, flagpole.flagY)
            ctx.lineTo(flagpole.x - 32, flagpole.flagY + 12)
            ctx.lineTo(flagpole.x, flagpole.flagY + 24)
            ctx.fill()
          }
        }

        function drawItemsAndEnemies() {
          // Items
          items.forEach((item) => {
            if (item.type === "coin") {
              const pulse = Math.sin(frameCount * 0.15) * 3
              ctx.fillStyle = "#facc15"
              ctx.beginPath()
              ctx.ellipse(item.x + 8, item.y + 10, Math.max(3, 7 - Math.abs(pulse)), 10, 0, 0, Math.PI * 2)
              ctx.fill()
              ctx.strokeStyle = "#ca8a04"
              ctx.lineWidth = 2
              ctx.stroke()
            } else if (item.type === "mushroom") {
              // Stem
              ctx.fillStyle = "#fef3c7"
              ctx.fillRect(item.x + 6, item.y + 13, 12, 13)
              // Cap
              ctx.fillStyle = "#ef4444"
              ctx.beginPath()
              ctx.arc(item.x + 12, item.y + 13, 12, Math.PI, 0)
              ctx.fill()
              // Spots
              ctx.fillStyle = "#fff"
              ctx.beginPath()
              ctx.arc(item.x + 7, item.y + 8, 3, 0, Math.PI * 2)
              ctx.arc(item.x + 17, item.y + 8, 3, 0, Math.PI * 2)
              ctx.fill()
            }
          })

          // Enemies (Goombas)
          enemies.forEach((en) => {
            if (en.dead) {
              ctx.fillStyle = "#92400e"
              ctx.fillRect(en.x, en.y + 18, en.w, 10)
              return
            }
            // Body
            ctx.fillStyle = "#92400e"
            ctx.beginPath()
            ctx.arc(en.x + 14, en.y + 13, 13, Math.PI, 0)
            ctx.lineTo(en.x + 26, en.y + 20)
            ctx.lineTo(en.x + 2, en.y + 20)
            ctx.fill()
            // Feet
            const step = Math.sin(frameCount * 0.25) * 3
            ctx.fillStyle = "#1c1917"
            ctx.fillRect(en.x + 3 + step, en.y + 20, 9, 8)
            ctx.fillRect(en.x + 16 - step, en.y + 20, 9, 8)
            // Eyes
            ctx.fillStyle = "#fff"
            ctx.fillRect(en.x + 7, en.y + 9, 5, 6)
            ctx.fillRect(en.x + 16, en.y + 9, 5, 6)
            ctx.fillStyle = "#000"
            ctx.fillRect(en.x + 9, en.y + 11, 2, 4)
            ctx.fillRect(en.x + 17, en.y + 11, 2, 4)
          })
        }

        function drawPlayer() {
          if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return

          const x = player.x
          const y = player.y
          const w = player.w
          const h = player.h

          ctx.save()
          if (player.facing === -1) {
            ctx.translate(x + w / 2, 0)
            ctx.scale(-1, 1)
            ctx.translate(-(x + w / 2), 0)
          }

          // Hat
          ctx.fillStyle = "#ef4444"
          ctx.fillRect(x + 2, y, w - 4, 6)
          ctx.fillRect(x + 4, y + 3, w, 3) // brim

          // Face
          ctx.fillStyle = "#fed7aa"
          ctx.fillRect(x + 3, y + 6, w - 5, 10)
          // Eye & Mustache
          ctx.fillStyle = "#000"
          ctx.fillRect(x + 15, y + 8, 3, 4)
          ctx.fillRect(x + 13, y + 13, 8, 2)

          // Shirt & Overalls
          const bodyTop = y + 16
          const bodyH = h - 22
          ctx.fillStyle = "#ef4444"
          ctx.fillRect(x + 2, bodyTop, w - 4, bodyH)
          ctx.fillStyle = "#2563eb"
          ctx.fillRect(x + 4, bodyTop + 4, w - 8, bodyH - 4)
          // Buttons
          ctx.fillStyle = "#fde047"
          ctx.fillRect(x + 6, bodyTop + 6, 3, 3)
          ctx.fillRect(x + 14, bodyTop + 6, 3, 3)

          // Legs / Shoes
          const legOffset = !player.grounded ? 4 : player.animFrame === 1 ? 3 : player.animFrame === 2 ? -3 : 0
          ctx.fillStyle = "#78350f"
          ctx.fillRect(x + 2 + legOffset, y + h - 6, 8, 6)
          ctx.fillRect(x + 14 - legOffset, y + h - 6, 8, 6)

          ctx.restore()
        }

        function draw() {
          drawBackground()

          ctx.save()
          ctx.translate(-Math.floor(cameraX), 0)

          drawProps()
          drawTiles()
          drawItemsAndEnemies()
          drawPlayer()

          // Particles
          particles.forEach((p) => {
            ctx.fillStyle = p.color
            ctx.fillRect(p.x, p.y, p.size, p.size)
          })

          // Floating Score Texts
          ctx.font = "bold 14px Courier New"
          ctx.fillStyle = "#fff"
          floatingTexts.forEach((ft) => {
            ctx.fillText(ft.text, ft.x, ft.y)
          })

          ctx.restore()
        }

        function loop() {
          update()
          draw()
          requestAnimationFrame(loop)
        }

        buildLevel()
        loop()
      })()
    </script>
  </body>
</html>

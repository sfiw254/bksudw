<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatu</title>
    <style>
      .cam {
        display: inline-block;
        border: solid 0.1rem lightgray;
      }

      img {
        width: 195px;
        height: 110px;
      }

      .hide {
        display: none;
      }

      @media (max-width: 768px) {
        img {
          width: 135px;
          height: 76px;
        }
      }
    </style>
  </head>

  <body>
    <input />
    <button id="add" onclick="clickAdd()">Add</button>
    <div class="content"></div>
    <script>
      let users, followed
      let refreshTimeout, refreshInterval

      init()

      async function init() {
        const res = await fetch("https://api.jsonbin.io/v3/b/6a96b3e9da38895dfe2a8bc9", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": "$2a$10$HKvQ2eV1Hypp05KcTnfD4Ot/VvlNBykosM8cShL/K8Evz0nFL/PnK"
          }
        })
        const data = await res.json()
        users = data.record
        renderUsers()
        const res2 = await fetch("/chatu?l=123")
        const data2 = await res2.json()
        followed = data2
        renderFollowed()
      }

      function renderUsers() {
        let html = ``
        users.forEach((el) => {
          html += `<div class="cam" id="${el}">
        <img class="${el}" src="https://jpeg.live.mmcdn.com/stream?room=${el}&f=${Math.random()}" onload="imgLoad(this)" onerror="imgError(this)" onclick="imgClick('${el}')" onmouseover="imgOver('${el}')" onmouseout = "imgOut('${el}')"><br>
        <button id="remove" onclick="removeClick('${el}')">🗑️</button>
        <button id="title" onclick="titleClick('${el}')">${el}</button>
        <button id="follow" class="" onclick="followClick('${el}')">★</button>
        <button id="unfollow" class="hide" onclick="unfollowClick('${el}')">⭐</button>
      </div>`
        })
        document.querySelector(".content").innerHTML = html
        document.querySelector("input").placeholder = `${users.length} cams`
      }

      function renderFollowed() {
        document.querySelectorAll(".cam").forEach((el) => {
          if (followed.includes(el.id)) {
            el.querySelector("#unfollow").classList.remove("hide")
            el.querySelector("#follow").classList.add("hide")
          } else {
            el.querySelector("#follow").classList.remove("hide")
            el.querySelector("#unfollow").classList.add("hide")
          }
        })
      }

      function imgError(img) {
        img.style.visibility = "hidden"
      }

      function imgLoad(img) {
        img.parentElement.parentElement.prepend(img.parentElement)
        img.onload = null
      }

      function imgClick(user) {
        window.open("https://chaturbate.com/" + user, "_blank", "noopener,noreferrer")
      }

      function imgOver(user) {
        clearTimeout(refreshTimeout)
        refreshTimeout = setTimeout(() => {
          const img = document.querySelector(`img.${user}`)
          if (img.complete && img.naturalWidth > 0) {
            img.src = img.src.split("f=")[0] + "f=" + Math.random()
            clearInterval(refreshInterval)
            refreshInterval = setInterval(() => {
              const img = document.querySelector(`img.${user}`)
              img.src = img.src.split("f=")[0] + "f=" + Math.random()
            }, 200)
          }
        }, 300)
      }

      function imgOut(user) {
        clearTimeout(refreshTimeout)
        clearInterval(refreshInterval)
      }

      function titleClick(user) {
        window.open("https://www.google.com/search?udm=2&tbs=isz:l&q=" + user + " porn", "_blank", "noopener,noreferrer")
      }

      function removeClick(user) {
        if (window.confirm("Sure to remove?")) {
          users = users.filter((el) => el !== user)
          updateBin()
        }
      }

      function followClick(user) {
        if (window.confirm("Sure to follow?")) {
          fetch(`/chatu?f=${user}`).then((res) => window.location.reload())
        }
      }

      function unfollowClick(user) {
        if (window.confirm("Sure to unfollow?")) {
          fetch(`/chatu?u=${user}`).then((res) => window.location.reload())
        }
      }

      function clickAdd() {
        input = document.querySelector("input")
        if (input.value) {
          if (window.confirm("Sure to add?")) {
            users.unshift(input.value)
            users = [...new Set(users)]
            updateBin()
          }
        }
      }

      function updateBin() {
        fetch("https://api.jsonbin.io/v3/b/6a96b3e9da38895dfe2a8bc9", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": "$2a$10$HKvQ2eV1Hypp05KcTnfD4Ot/VvlNBykosM8cShL/K8Evz0nFL/PnK"
          },
          body: JSON.stringify(users)
        }).then((res) => window.location.reload())
      }
    </script>
  </body>
</html>

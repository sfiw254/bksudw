<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Dark Showroom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      background: #131314;
      overflow: hidden;
      cursor: default;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e3e3e3;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: default; }

    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1e1f20;
      border: 1px solid #333537;
      color: #e3e3e3;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0.32;
      transition: background 0.15s, border-color 0.15s, opacity 0.2s;
    }
    .nav-arrow:hover {
      background: #2b2d2f;
      border-color: #8ab4f8;
      color: #8ab4f8;
      opacity: 0.78;
    }
    #prevModelBig { left: 22px; }
    #nextModelBig { right: 22px; }

    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e1f20;
      border: 1px solid #333537;
      padding: 8px 14px;
      border-radius: 28px;
      z-index: 20;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 96vw;
      opacity: 0.32;
      transition: opacity 0.2s;
      -webkit-touch-callout: none;
    }
    .bottom-bar:hover,
    .bottom-bar:focus-within {
      opacity: 0.78;
    }

    .bar-toggle {
      display: none;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 14px;
      border-radius: 8px 8px 0 0;
      background: #1e1f20;
      border: 1px solid #333537;
      border-bottom: none;
      color: #e3e3e3;
      font-size: 9px;
      line-height: 1;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: none;
    }

    @media (max-width: 768px), (pointer: coarse) {
      .bottom-bar {
        bottom: 48px;
        opacity: 0.32;
        transition: none;
      }
      .bottom-bar:hover,
      .bottom-bar:focus-within {
        opacity: 0.32;
      }
      .bottom-bar.expanded {
        opacity: 0.78;
        transition: opacity 0.15s;
      }
      .bottom-bar.expanded:hover,
      .bottom-bar.expanded:focus-within {
        opacity: 0.78;
      }
      .bar-toggle {
        display: flex;
      }
      .bottom-bar.expanded .bar-toggle {
        display: none;
      }
      .bottom-bar:not(.expanded) .bar-group:not(.primary-group),
      .bottom-bar:not(.expanded) .divider {
        display: none;
      }
      .bottom-bar:not(.expanded) .primary-group * {
        pointer-events: none;
      }
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: #333537;
    }

    .btn-sm {
      background: #282a2c;
      border: 1px solid #3c4043;
      color: #e3e3e3;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      white-space: nowrap;
    }
    .btn-sm:hover {
      background: #35373a;
      border-color: #8ab4f8;
    }
    .btn-sm.active {
      background: rgba(138, 180, 248, 0.18);
      border-color: #8ab4f8;
      color: #8ab4f8;
    }
    .btn-sm:disabled {
      opacity: 0.4;
      cursor: default;
      border-color: #3c4043;
    }

    .icon-btn {
      width: 28px;
      padding: 0;
      font-size: 13px;
    }

    .model-select {
      background: #282a2c;
      border: 1px solid #3c4043;
      color: #e3e3e3;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      min-width: 148px;
      text-align: center;
      cursor: pointer;
      outline: none;
      transition: 0.15s;
    }
    .model-select:hover, .model-select:focus {
      background: #35373a;
      border-color: #8ab4f8;
    }
    .model-select option {
      background: #1e1f20;
      color: #e3e3e3;
    }

    .ctrl-label {
      font-size: 12px;
      font-weight: 500;
      color: #e3e3e3;
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 76px;
      height: 4px;
      background: #3c4043;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #8ab4f8;
      cursor: pointer;
    }
    input[type="range"]:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .chk-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #e3e3e3;
      cursor: pointer;
      white-space: nowrap;
      padding: 0 4px;
    }
    .chk-label input[type="checkbox"] {
      accent-color: #8ab4f8;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    #loaderStatus {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1f20;
      border: 1px solid #333537;
      color: #c4c7c5;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 16px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #loaderStatus.visible { opacity: 1; }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(138, 180, 248, 0.25);
      border-top-color: #8ab4f8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="loaderStatus">
    <span class="spinner"></span>
    <span id="loaderText">Loading 3D Model...</span>
  </div>
  <button id="prevModelBig" class="nav-arrow" title="Previous Model">&#10094;</button>
  <button id="nextModelBig" class="nav-arrow" title="Next Model">&#10095;</button>
  <div id="bottomBar" class="bottom-bar">
    <div id="barToggle" class="bar-toggle">&#9650;</div>
    <div class="bar-group primary-group">
      <button id="prevModelSm" class="btn-sm icon-btn" title="Previous Model">&#10094;</button>
      <select id="modelSelect" class="model-select" title="Select 3D Model"></select>
      <button id="nextModelSm" class="btn-sm icon-btn" title="Next Model">&#10095;</button>
    </div>
    <div class="divider"></div>
    <div class="bar-group">
      <button id="prevHdr" class="btn-sm icon-btn" title="Previous Lighting">&#10094;</button>
      <select id="hdrSelect" class="model-select" title="Select Lighting"></select>
      <button id="nextHdr" class="btn-sm icon-btn" title="Next Lighting">&#10095;</button>
    </div>
    <div class="divider"></div>
    <div class="bar-group">
      <button id="animBtn" class="btn-sm active" title="Toggle Model Animation" disabled>Anim</button>
      <input type="range" id="animSlider" min="0" max="1" step="0.001" value="0" title="Animation Timeline" disabled>
    </div>
    <div class="divider"></div>
    <div class="bar-group">
      <button id="autoRotBtn" class="btn-sm active" title="Toggle Auto Rotation">Rot</button>
      <input type="range" id="rotSpeedSlider" min="0.075" max="0.65" step="0.005" value="0.075" title="Rotation Speed">
    </div>
    <div class="divider"></div>
    <div class="bar-group">
      <label class="chk-label" title="Toggle Studio Realism">
        <input type="checkbox" id="realismChk" checked>
        Studio Realism
      </label>
    </div>
    <div class="divider"></div>
    <div class="bar-group">
      <span class="ctrl-label">Exposure</span>
      <input type="range" id="shadowLiftSlider" min="-1" max="1" step="0.02" value="0" title="Adjust Exposure & Shadow Depth">
    </div>
    <div class="divider"></div>
    <div class="bar-group">
      <label for="glbInput" class="btn-sm" style="cursor:pointer;">+ Load .GLB</label>
      <input type="file" id="glbInput" accept=".glb,.gltf" multiple style="display:none;">
    </div>
  </div>
  <script>
  function loadScript(urls) {
    return new Promise((resolve, reject) => {
      let idx = 0;

      function tryNext() {
        if (idx >= urls.length) return reject(new Error('Failed to load script'));
        const s = document.createElement('script');
        s.src = urls[idx++];
        s.onload = resolve;
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  (async function bootstrap() {
    const statusEl = document.getElementById('loaderStatus');
    const loaderText = document.getElementById('loaderText');
    loaderText.textContent = 'Initializing 3D Engine...';
    statusEl.classList.add('visible');

    try {
      await loadScript([
        ['https:/', 'cdn.jsdelivr.net', 'npm', 'three@0.147.0', 'build', 'three.min.js'].join('/'),
        ['https:/', 'unpkg.com', 'three@0.147.0', 'build', 'three.min.js'].join('/')
      ]);
      await loadScript([
        ['https:/', 'cdn.jsdelivr.net', 'npm', 'three@0.147.0', 'examples', 'js', 'loaders', 'GLTFLoader.js'].join('/'),
        ['https:/', 'unpkg.com', 'three@0.147.0', 'examples', 'js', 'loaders', 'GLTFLoader.js'].join('/')
      ]);
      await loadScript([
        ['https:/', 'cdn.jsdelivr.net', 'npm', 'three@0.147.0', 'examples', 'js', 'environments', 'RoomEnvironment.js'].join('/'),
        ['https:/', 'unpkg.com', 'three@0.147.0', 'examples', 'js', 'environments', 'RoomEnvironment.js'].join('/')
      ]);
      initApp();
    } catch (e) {
      loaderText.textContent = 'Error loading 3D Engine';
    }
  })();

  function initApp() {
    const statusEl = document.getElementById('loaderStatus');
    const loaderText = document.getElementById('loaderText');
    const realismChk = document.getElementById('realismChk');
    const shadowLiftSlider = document.getElementById('shadowLiftSlider');
    const bottomBar = document.getElementById('bottomBar');
    let isRealism = realismChk.checked;
    let shadowLift = parseFloat(shadowLiftSlider.value);

    bottomBar.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    bottomBar.addEventListener('click', (e) => {
      if (!bottomBar.classList.contains('expanded')) {
        e.preventDefault();
        e.stopPropagation();
        bottomBar.classList.add('expanded');
      }
    });

    function setLoader(msg) {
      if (msg) {
        loaderText.textContent = msg;
        statusEl.classList.add('visible');
      } else {
        statusEl.classList.remove('visible');
      }
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x131314);

    const baseCameraZ = 330;
    const baseCameraY = 12;
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 2000);
    camera.position.set(0, baseCameraY, baseCameraZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.physicallyCorrectLights = isRealism;
    renderer.shadowMap.enabled = isRealism;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222630, 0.85);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(160, 260, 200);
    keyLight.castShadow = isRealism;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 50;
    keyLight.shadow.camera.far = 700;
    const d = 140;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.normalBias = 0.03;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x8ab4f8, 1.4);
    rimLight.position.set(-200, 140, -180);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xffd2a6, 0.9);
    fillLight.position.set(120, -40, -150);
    scene.add(fillLight);

    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();

    const roomEnvRT = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04);

    // Soft contact shadow plane beneath model
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 256;
    shadowCanvas.height = 256;
    const sCtx = shadowCanvas.getContext('2d');
    const grad = sCtx.createRadialGradient(128, 128, 10, 128, 128, 124);
    grad.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
    grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.28)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
    sCtx.fillStyle = grad;
    sCtx.fillRect(0, 0, 256, 256);

    const contactShadowTex = new THREE.CanvasTexture(shadowCanvas);
    const contactShadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(175, 175),
      new THREE.MeshBasicMaterial({ map: contactShadowTex, transparent: true, depthWrite: false })
    );
    contactShadowPlane.rotation.x = -Math.PI / 2;
    contactShadowPlane.position.y = -46.5;
    contactShadowPlane.visible = isRealism;

    // Real-time soft shadow catcher plane
    const shadowCatcher = new THREE.Mesh(
      new THREE.PlaneGeometry(320, 320),
      new THREE.ShadowMaterial({ opacity: 0.38 })
    );
    shadowCatcher.rotation.x = -Math.PI / 2;
    shadowCatcher.position.y = -46.4;
    shadowCatcher.receiveShadow = true;
    shadowCatcher.visible = isRealism;

    // Presets from original code (Standard Mode)
    const standardPresets = [{
        name: 'Studio Soft (Default)',
        useRoomEnv: false,
        exposure: 1.05,
        envIntensity: 0.55,
        aoIntensity: 1.0,
        hemi: [0xffffff, 0x222630, 1.35],
        key: [0xffffff, 2.2],
        rim: [0x8ab4f8, 1.0],
        fill: [0xffd2a6, 0.75],
        panels: [
          { pos: [0, 80, 0], rot: [Math.PI / 2, 0, 0], size: [120, 120], color: 0xffffff },
          { pos: [90, 30, 60], rot: [0, -Math.PI / 3, 0], size: [70, 90], color: 0xf4f7ff },
          { pos: [-90, 20, -60], rot: [0, Math.PI / 3, 0], size: [70, 90], color: 0xd0e2ff }
        ]
      },
      {
        name: 'Golden Sunset',
        useRoomEnv: false,
        exposure: 1.12,
        envIntensity: 0.72,
        aoIntensity: 1.0,
        hemi: [0xffdfb8, 0x2a1d24, 1.25],

        rim: [0xff5e7e, 1.3],
        fill: [0x6b8cce, 0.7],
        panels: [
          { pos: [100, 25, 40], rot: [0, -Math.PI / 2.4, 0], size: [90, 90], color: 0xff9d3b },
          { pos: [-80, 50, -50], rot: [0, Math.PI / 3, 0], size: [100, 80], color: 0x4a6fa5 },
          { pos: [0, 90, 0], rot: [Math.PI / 2, 0, 0], size: [110, 110], color: 0xffd2a1 }
        ]
      },
      {
        name: 'Cyber Neon Night',
        useRoomEnv: false,
        exposure: 1.15,
        envIntensity: 0.8,
        aoIntensity: 1.0,
        hemi: [0x7dd3fc, 0x161224, 1.15],
        key: [0x38bdf8, 2.3],
        rim: [0xf43f5e, 1.65],
        fill: [0xa855f7, 0.95],
        panels: [
          { pos: [85, 30, 50], rot: [0, -Math.PI / 3, 0], size: [65, 100], color: 0x00f0ff },
          { pos: [-85, 25, -40], rot: [0, Math.PI / 3, 0], size: [65, 100], color: 0xff1e6e },
          { pos: [0, 85, 0], rot: [Math.PI / 2, 0, 0], size: [100, 100], color: 0x8b5cf6 }
        ]
      },

        hemi: [0xdbeafe, 0x2b303a, 1.55],
        key: [0xf1f5f9, 1.9],
        rim: [0x93c5fd, 0.9],
        fill: [0xcbd5e1, 0.85],
        panels: [
          { pos: [0, 90, 0], rot: [Math.PI / 2, 0, 0], size: [160, 160], color: 0xe2e8f0 },
          { pos: [95, 35, 0], rot: [0, -Math.PI / 2, 0], size: [120, 80], color: 0xcbd5e1 },
          { pos: [-95, 35, 0], rot: [0, Math.PI / 2, 0], size: [120, 80], color: 0xdbeafe }
        ]
      },
      {
        name: 'Warm Garage Loft',
        useRoomEnv: false,
        exposure: 1.08,
        envIntensity: 0.68,
        aoIntensity: 1.0,
        hemi: [0xfef3c7, 0x1f1c18, 1.25],
        key: [0xfde68a, 2.35],
        rim: [0x60a5fa, 0.95],
        fill: [0xfdba74, 0.8],
        panels: [
          { pos: [0, 85, 20], rot: [Math.PI / 2.2, 0, 0], size: [130, 50], color: 0xfef08a },
          { pos: [80, 20, -60], rot: [0, -Math.PI / 4, 0], size: [70, 70], color: 0xfdba74 },
          { pos: [-85, 30, 50], rot: [0, Math.PI / 3, 0], size: [70, 70], color: 0x93c5fd }
        ]
      }
    ];

    // Presets from v2 code (Studio Realism Mode)
    const realismPresets = [{
        name: 'Studio Soft (Default)',
        useRoomEnv: true,
        exposure: 1.0,
        envIntensity: 1.05,
        aoIntensity: 1.35,
        hemi: [0xffffff, 0x222630, 0.75],
        key: [0xffffff, 2.8],
        rim: [0x8ab4f8, 1.2],
        fill: [0xffd2a6, 0.8]
      },
      {
        name: 'Golden Sunset',
        useRoomEnv: false,
        exposure: 1.12,
        envIntensity: 0.95,
        aoIntensity: 1.25,
        hemi: [0xffdfb8, 0x2a1d24, 1.1],
        key: [0xffa952, 3.2],
        rim: [0xff5e7e, 1.5],
        fill: [0x6b8cce, 0.9],
        panels: [
          { pos: [100, 25, 40], rot: [0, -Math.PI / 2.4, 0], size: [90, 90], color: 0xff9d3b },
          { pos: [-80, 50, -50], rot: [0, Math.PI / 3, 0], size: [100, 80], color: 0x4a6fa5 },
          { pos: [0, 90, 0], rot: [Math.PI / 2, 0, 0], size: [110, 110], color: 0xffd2a1 }
        ]
      },
      {
        name: 'Cyber Neon Night',
        useRoomEnv: false,
        exposure: 1.15,
        envIntensity: 1.0,
        aoIntensity: 1.3,
        hemi: [0x7dd3fc, 0x161224, 1.0],
        key: [0x38bdf8, 2.9],
        rim: [0xf43f5e, 1.9],
        fill: [0xa855f7, 1.1],
        panels: [
          { pos: [85, 30, 50], rot: [0, -Math.PI / 3, 0], size: [65, 100], color: 0x00f0ff },
          { pos: [-85, 25, -40], rot: [0, Math.PI / 3, 0], size: [65, 100], color: 0xff1e6e },
          { pos: [0, 85, 0], rot: [Math.PI / 2, 0, 0], size: [100, 100], color: 0x8b5cf6 }
        ]
      },
      {
        name: 'Overcast Outdoor',
        useRoomEnv: false,
        exposure: 1.02,
        envIntensity: 0.95,
        aoIntensity: 1.3,
        hemi: [0xdbeafe, 0x2b303a, 1.4],
        key: [0xf1f5f9, 2.4],
        rim: [0x93c5fd, 1.1],
        fill: [0xcbd5e1, 1.0],
        panels: [
          { pos: [0, 90, 0], rot: [Math.PI / 2, 0, 0], size: [160, 160], color: 0xe2e8f0 },
          { pos: [95, 35, 0], rot: [0, -Math.PI / 2, 0], size: [120, 80], color: 0xcbd5e1 },
          { pos: [-95, 35, 0], rot: [0, Math.PI / 2, 0], size: [120, 80], color: 0xdbeafe }
        ]
      },
      {
        name: 'Warm Garage Loft',
        useRoomEnv: false,
        exposure: 1.08,
        envIntensity: 0.95,
        aoIntensity: 1.3,
        hemi: [0xfef3c7, 0x1f1c18, 1.1],
        key: [0xfde68a, 2.9],
        rim: [0x60a5fa, 1.1],
        fill: [0xfdba74, 0.95],
        panels: [
          { pos: [0, 85, 20], rot: [Math.PI / 2.2, 0, 0], size: [130, 50], color: 0xfef08a },
          { pos: [80, 20, -60], rot: [0, -Math.PI / 4, 0], size: [70, 70], color: 0xfdba74 },
          { pos: [-85, 30, 50], rot: [0, Math.PI / 3, 0], size: [70, 70], color: 0x93c5fd }
        ]
      }
    ];

    // Pre-cache all PMREM environment textures so switching presets or realism never stalls
    const envRTCache = { standard: [], realism: [] };

    function buildEnvCacheForList(list, targetArray) {
      list.forEach((p, idx) => {
        if (p.useRoomEnv) {
          targetArray[idx] = roomEnvRT;
        } else {
          const envScene = new THREE.Scene();
          envScene.background = new THREE.Color(p.hemi[1]);
          p.panels.forEach((pan) => {
            const m = new THREE.Mesh(
              new THREE.PlaneGeometry(pan.size[0], pan.size[1]),
              new THREE.MeshBasicMaterial({ color: pan.color, side: THREE.DoubleSide })
            );
            m.position.set(pan.pos[0], pan.pos[1], pan.pos[2]);
            m.rotation.set(pan.rot[0], pan.rot[1], pan.rot[2]);
            envScene.add(m);
          });
          targetArray[idx] = pmrem.fromScene(envScene, 0.04);
        }
      });
    }

    buildEnvCacheForList(standardPresets, envRTCache.standard);
    buildEnvCacheForList(realismPresets, envRTCache.realism);

    let currentHdrIdx = 0;
    const hdrSelect = document.getElementById('hdrSelect');

    function buildHdrDropdown() {
      hdrSelect.innerHTML = '';
      realismPresets.forEach((p, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.name;
        hdrSelect.appendChild(opt);
      });
      hdrSelect.value = currentHdrIdx;
    }

    function getActivePresets() {
      return isRealism ? realismPresets : standardPresets;
    }

    function applyHdrPreset(idx) {
      const presets = getActivePresets();
      currentHdrIdx = (idx + presets.length) % presets.length;
      const p = presets[currentHdrIdx];
      hdrSelect.value = currentHdrIdx;

      // Exposure slider: at 0 leaves everything 100% untouched; >0 brightens shadows, <0 deepens shadows & occlusion
      const lift = isRealism ? shadowLift : 0;

      if (lift >= 0) {
        renderer.toneMappingExposure = p.exposure + lift * 0.25;
        hemiLight.color.setHex(p.hemi[0]);
        hemiLight.groundColor.setHex(p.hemi[1]);
        hemiLight.intensity = p.hemi[2] + lift * 2.1;

        keyLight.color.setHex(p.key[0]);
        keyLight.intensity = p.key[1] + lift * 0.6;
        rimLight.color.setHex(p.rim[0]);
        rimLight.intensity = p.rim[1] + lift * 0.85;
        fillLight.color.setHex(p.fill[0]);
        fillLight.intensity = p.fill[1] + lift * 1.75;
        shadowCatcher.material.opacity = 0.38;
        contactShadowPlane.material.opacity = 1.0;
      } else {
        const dark = -lift; // 0 to 1
        renderer.toneMappingExposure = Math.max(0.55, p.exposure - dark * 0.32);
        hemiLight.color.setHex(p.hemi[0]);
        hemiLight.groundColor.setHex(p.hemi[1]);
        hemiLight.intensity = Math.max(0.08, p.hemi[2] * (1 - dark * 0.85));

        keyLight.color.setHex(p.key[0]);
        keyLight.intensity = Math.max(0.6, p.key[1] * (1 - dark * 0.35));
        rimLight.color.setHex(p.rim[0]);
        rimLight.intensity = Math.max(0.15, p.rim[1] * (1 - dark * 0.7));
        fillLight.color.setHex(p.fill[0]);
        fillLight.intensity = Math.max(0.05, p.fill[1] * (1 - dark * 0.9));
        shadowCatcher.material.opacity = 0.38 + dark * 0.42;
        contactShadowPlane.material.opacity = 1.0;
      }

      const cacheBucket = isRealism ? envRTCache.realism : envRTCache.standard;
      scene.environment = cacheBucket[currentHdrIdx].texture;

      if (activeModel) {
        activeModel.traverse((child) => {
          if (child.isMesh && child.material) {
            if (lift >= 0) {
              child.material.envMapIntensity = p.envIntensity + lift * 0.4;
              if (child.material.aoMap) {
                child.material.aoMapIntensity = isRealism ? Math.max(0.15, p.aoIntensity * (1 - lift * 0.75)) : 0;
              }
            } else {
              const dark = -lift;
              child.material.envMapIntensity = Math.max(0.25, p.envIntensity * (1 - dark * 0.6));
              if (child.material.aoMap) {
                child.material.aoMapIntensity = isRealism ? p.aoIntensity * (1 + dark * 1.1) : 0;
              }
            }
            child.material.needsUpdate = true;
          }
        });
      }
    }

    shadowLiftSlider.addEventListener('input', (e) => {
      shadowLift = parseFloat(e.target.value);
      if (isRealism) {
        applyHdrPreset(currentHdrIdx);
      }
    });

    function applyRealismState() {
      shadowLiftSlider.disabled = !isRealism;
      renderer.physicallyCorrectLights = isRealism;
      renderer.shadowMap.enabled = isRealism;
      renderer.shadowMap.needsUpdate = true;
      keyLight.castShadow = isRealism;
      contactShadowPlane.visible = isRealism;
      shadowCatcher.visible = isRealism;

      if (activeModel) {
        activeModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = isRealism;
            child.receiveShadow = isRealism;
          }
        });
      }
      applyHdrPreset(currentHdrIdx);
    }

    realismChk.addEventListener('change', () => {
      isRealism = realismChk.checked;
      setLoader(isRealism ? 'Switching to Studio Realism...' : 'Switching to Standard Mode...');

      requestAnimationFrame(() => {
        setTimeout(() => {
          applyRealismState();
          requestAnimationFrame(() => {
            setLoader(null);
          });
        }, 16);
      });
    });

    const stageGroup = new THREE.Group();
    stageGroup.position.y = 14;
    stageGroup.add(contactShadowPlane);
    stageGroup.add(shadowCatcher);
    scene.add(stageGroup);

    const baseKhronos = ['https:/', 'cdn.jsdelivr.net', 'gh', 'KhronosGroup', 'glTF-Sample-Assets@main', 'Models'].join('/');
    const models = [{
        name: 'Sci-Fi Helmet',
        url: baseKhronos + '/SciFiHelmet/glTF/SciFiHelmet.gltf'
      },
      {
        name: 'Commercial Refrigerator',
        url: baseKhronos + '/CommercialRefrigerator/glTF-Binary/CommercialRefrigerator.glb'
      },
      {
        name: 'Sheen Wood Leather Sofa',
        url: baseKhronos + '/SheenWoodLeatherSofa/glTF-Binary/SheenWoodLeatherSofa.glb'
      },
      {
        name: 'Glam Velvet Sofa',
        url: baseKhronos + '/GlamVelvetSofa/glTF-Binary/GlamVelvetSofa.glb'
      },
      {
        name: 'Sheen Cloth',
        url: baseKhronos + '/SheenCloth/glTF-Binary/SheenCloth.glb'
      },
      {
        name: 'Fox',
        url: baseKhronos + '/Fox/glTF-Binary/Fox.glb'
      },
      {
        name: 'Skull',
        url: baseKhronos + '/ScatteringSkull/glTF-Binary/ScatteringSkull.glb'
      },
      {
        name: 'Dragon Attenuation',
        url: baseKhronos + '/DragonAttenuation/glTF-Binary/DragonAttenuation.glb'
      },
      {
        name: 'Dragon Dispersion',
        url: baseKhronos + '/DragonDispersion/glTF-Binary/DragonDispersion.glb'
      }
    ];

    const modelSelect = document.getElementById('modelSelect');

    function rebuildModelDropdown() {
      modelSelect.innerHTML = '';
      models.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = m.name;
        modelSelect.appendChild(opt);
      });
      modelSelect.value = currentModelIdx;
    }

    let currentModelIdx = 0;
    let loadRequestToken = 0;
    let loadDebounceTimer = null;
    let activeModel = null;
    let mixer = null;
    let animActions = [];
    let animDuration = 0;
    let animPlaying = true;
    let isScrubbingAnim = false;
    const clock = new THREE.Clock();
    const animBtn = document.getElementById('animBtn');
    const animSlider = document.getElementById('animSlider');
    const gltfLoader = new THREE.GLTFLoader();

    animBtn.addEventListener('click', () => {
      if (!mixer) return;
      animPlaying = !animPlaying;
      animBtn.classList.toggle('active', animPlaying);
    });

    animSlider.addEventListener('mousedown', () => { isScrubbingAnim = true; });
    animSlider.addEventListener('touchstart', () => { isScrubbingAnim = true; }, { passive: true });
    window.addEventListener('mouseup', () => { isScrubbingAnim = false; });
    window.addEventListener('touchend', () => { isScrubbingAnim = false; });

    animSlider.addEventListener('input', (e) => {
      if (!mixer || animDuration <= 0) return;
      const targetTime = parseFloat(e.target.value) * animDuration;
      animActions.forEach((act) => {
        act.time = targetTime;
      });
      mixer.update(0);
    });

    function executeLoadModel(idx, token) {
      const item = models[idx];
      setLoader('Loading ' + item.name + '...');

      gltfLoader.load(
        item.url,
        (gltf) => {
          if (token !== loadRequestToken) return;

          if (activeModel) {
            stageGroup.remove(activeModel);
          }
          if (mixer) {
            mixer.stopAllAction();
            mixer = null;
            animActions = [];
            animDuration = 0;
          }

          resetCameraView();
          shadowLift = 0;
          shadowLiftSlider.value = 0;
          applyHdrPreset(currentHdrIdx);

          const root = gltf.scene;
          const box = new THREE.Box3().setFromObject(root);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          const scale = 115 / maxDim;
          root.scale.setScalar(scale);

          const scaledBox = new THREE.Box3().setFromObject(root);
          const center = new THREE.Vector3();
          scaledBox.getCenter(center);
          root.position.sub(center);
          root.position.y += 12;

          // Position soft floor & contact shadow directly at bottom of the model
          const finalBox = new THREE.Box3().setFromObject(root);
          const bottomY = finalBox.min.y;
          contactShadowPlane.position.y = bottomY - 0.15;
          shadowCatcher.position.y = bottomY - 0.05;

          const footprint = Math.max(finalBox.max.x - finalBox.min.x, finalBox.max.z - finalBox.min.z) * 1.65;
          contactShadowPlane.scale.set(footprint / 175, footprint / 175, 1);

          const preset = getActivePresets()[currentHdrIdx];
          const lift = isRealism ? shadowLift : 0;

          root.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = isRealism;
              child.receiveShadow = isRealism;

              if (child.geometry && child.geometry.attributes.uv && !child.geometry.attributes.uv2) {
                child.geometry.setAttribute('uv2', child.geometry.attributes.uv);
              }

              if (child.material) {
                if (lift >= 0) {
                  child.material.envMapIntensity = preset.envIntensity + lift * 0.4;
                  if (child.material.aoMap) {
                    child.material.aoMapIntensity = isRealism ? Math.max(0.15, preset.aoIntensity * (1 - lift * 0.75)) : 0;
                  }
                } else {
                  const dark = -lift;
                  child.material.envMapIntensity = Math.max(0.25, preset.envIntensity * (1 - dark * 0.6));
                  if (child.material.aoMap) {
                    child.material.aoMapIntensity = isRealism ? preset.aoIntensity * (1 + dark * 1.1) : 0;
                  }
                }
                child.material.needsUpdate = true;
              }
            }
          });

          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(root);
            gltf.animations.forEach((clip) => {
              const action = mixer.clipAction(clip);
              action.play();
              animActions.push(action);
              if (clip.duration > animDuration) animDuration = clip.duration;
            });
            animPlaying = true;
            animBtn.disabled = false;
            animBtn.classList.add('active');
            animSlider.disabled = false;
            animSlider.value = 0;
          } else {
            animPlaying = false;
            animBtn.disabled = true;
            animBtn.classList.remove('active');
            animSlider.disabled = true;
            animSlider.value = 0;
          }

          activeModel = root;
          stageGroup.add(activeModel);
          renderer.shadowMap.needsUpdate = true;
          setLoader(null);
        },
        undefined,
        () => {
          if (token !== loadRequestToken) return;
          setLoader('Failed to load ' + item.name);
        }
      );
    }

    function loadModel(idx, immediate = false) {
      currentModelIdx = (idx + models.length) % models.length;
      modelSelect.value = currentModelIdx;
      const item = models[currentModelIdx];
      const token = ++loadRequestToken;

      if (loadDebounceTimer) {
        clearTimeout(loadDebounceTimer);
        loadDebounceTimer = null;
      }

      if (immediate) {
        executeLoadModel(currentModelIdx, token);
      } else {
        setLoader('Selected: ' + item.name);
        loadDebounceTimer = setTimeout(() => {
          executeLoadModel(currentModelIdx, token);
        }, 260);
      }
    }

    modelSelect.addEventListener('change', (e) => {
      loadModel(parseInt(e.target.value, 10), true);
      modelSelect.blur();
    });

    hdrSelect.addEventListener('change', (e) => {
      applyHdrPreset(parseInt(e.target.value, 10));
      hdrSelect.blur();
    });

    document.getElementById('prevModelBig').addEventListener('click', () => loadModel(currentModelIdx - 1));
    document.getElementById('nextModelBig').addEventListener('click', () => loadModel(currentModelIdx + 1));
    document.getElementById('prevModelSm').addEventListener('click', () => loadModel(currentModelIdx - 1));
    document.getElementById('nextModelSm').addEventListener('click', () => loadModel(currentModelIdx + 1));

    document.getElementById('prevHdr').addEventListener('click', () => applyHdrPreset(currentHdrIdx - 1));
    document.getElementById('nextHdr').addEventListener('click', () => applyHdrPreset(currentHdrIdx + 1));

    document.getElementById('glbInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;
      const firstNewIdx = models.length;
      files.forEach((file) => {
        const blobUrl = URL.createObjectURL(file);
        const cleanName = file.name.replace(/\.[^/.]+$/, '');
        models.push({ name: cleanName, url: blobUrl });
      });
      rebuildModelDropdown();
      loadModel(firstNewIdx, true);
      e.target.value = '';
    });

    let isOrbiting = false;
    let isPanning = false;
    let previousX = 0;
    let previousY = 0;
    let yaw = 30;
    let pitch = -14;
    let zoomZ = 105;
    let panX = 0;
    let panY = 0;
    let initialPinchDistance = 0;
    let initialZoomZ = 105;
    let prevTouchMidX = 0;
    let prevTouchMidY = 0;

    function resetCameraView() {
      zoomZ = 105;
      panX = 0;
      panY = 0;
    }

    const minZoom = -450;
    const maxZoom = 290;

    function getZoomPrecisionFactor() {
      const normalizedZoom = Math.max(0, (zoomZ - 40) / (maxZoom - 40));
      return Math.max(0.18, 1.0 - normalizedZoom * 0.82);
    }

    let autoRotate = true;
    const speedSlider = document.getElementById('rotSpeedSlider');
    let rotSpeed = parseFloat(speedSlider.value);
    const autoBtn = document.getElementById('autoRotBtn');

    autoBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      autoBtn.classList.toggle('active', autoRotate);
    });

    speedSlider.addEventListener('input', (e) => {
      rotSpeed = parseFloat(e.target.value);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') loadModel(currentModelIdx - 1);
      else if (e.code === 'ArrowRight') loadModel(currentModelIdx + 1);
      else if (e.code === 'Space') {
        e.preventDefault();
        autoRotate = !autoRotate;
        autoBtn.classList.toggle('active', autoRotate);
      }
    });

    function renderLoop() {
      const delta = clock.getDelta();
      if (mixer && animPlaying && !isScrubbingAnim) {
        mixer.update(delta);
        if (animDuration > 0 && animActions.length > 0) {
          animSlider.value = (animActions[0].time % animDuration) / animDuration;
        }
      }

      const precision = getZoomPrecisionFactor();
      if (autoRotate && !isOrbiting && !isPanning && rotSpeed > 0) {
        yaw += rotSpeed * precision;
      }
      const deg = Math.PI / 180;
      stageGroup.rotation.order = 'XYZ';
      stageGroup.rotation.x = -pitch * deg;
      stageGroup.rotation.y = yaw * deg;

      camera.position.x = -panX;
      camera.position.y = baseCameraY + panY;
      camera.position.z = baseCameraZ - zoomZ;

      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const canvas = renderer.domElement;

    canvas.addEventListener('mousedown', (e) => {
      if (document.activeElement && bottomBar.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      bottomBar.classList.remove('expanded');
      if (e.button === 0) {
        isOrbiting = true;
        previousX = e.clientX;
        previousY = e.clientY;
      } else if (e.button === 1) {
        e.preventDefault();
        isPanning = true;
        previousX = e.clientX;
        previousY = e.clientY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isOrbiting) {
        const precision = getZoomPrecisionFactor();
        yaw += (e.clientX - previousX) * 0.45 * precision;
        pitch = Math.max(-85, Math.min(85, pitch - (e.clientY - previousY) * 0.45 * precision));
        previousX = e.clientX;
        previousY = e.clientY;
      } else if (isPanning) {
        const precision = getZoomPrecisionFactor();
        panX += (e.clientX - previousX) * 0.14 * precision;
        panY += (e.clientY - previousY) * 0.14 * precision;
        previousX = e.clientX;
        previousY = e.clientY;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) isOrbiting = false;
      if (e.button === 1) isPanning = false;
    });

    window.addEventListener('mouseleave', () => {
      isOrbiting = false;
      isPanning = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const clampedDelta = Math.max(-100, Math.min(100, e.deltaY));
      zoomZ = Math.max(minZoom, Math.min(maxZoom, zoomZ - clampedDelta * 0.12));
    }, { passive: false });

    function getTouchDistance(t) {
      const t0 = t.item(0);
      const t1 = t.item(1);
      return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    }

    function getTouchMidpoint(t) {
      const t0 = t.item(0);
      const t1 = t.item(1);
      return {
        x: (t0.clientX + t1.clientX) * 0.5,
        y: (t0.clientY + t1.clientY) * 0.5
      };
    }

    canvas.addEventListener('touchstart', (e) => {
      bottomBar.classList.remove('expanded');
      if (e.touches.length === 1) {
        const t0 = e.touches.item(0);
        isOrbiting = true;
        isPanning = false;
        previousX = t0.clientX;
        previousY = t0.clientY;
      } else if (e.touches.length === 2) {
        isOrbiting = false;
        isPanning = true;
        initialPinchDistance = getTouchDistance(e.touches);
        initialZoomZ = zoomZ;
        const mid = getTouchMidpoint(e.touches);
        prevTouchMidX = mid.x;
        prevTouchMidY = mid.y;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isOrbiting) {
        const t0 = e.touches.item(0);
        const precision = getZoomPrecisionFactor();
        yaw += (t0.clientX - previousX) * 0.45 * precision;
        pitch = Math.max(-85, Math.min(85, pitch - (t0.clientY - previousY) * 0.45 * precision));
        previousX = t0.clientX;
        previousY = t0.clientY;
      } else if (e.touches.length === 2 && initialPinchDistance > 0) {
        zoomZ = Math.max(minZoom, Math.min(maxZoom, initialZoomZ + (getTouchDistance(e.touches) - initialPinchDistance) * 0.55));
        const mid = getTouchMidpoint(e.touches);
        const precision = getZoomPrecisionFactor();
        panX += (mid.x - prevTouchMidX) * 0.14 * precision;
        panY += (mid.y - prevTouchMidY) * 0.14 * precision;
        prevTouchMidX = mid.x;
        prevTouchMidY = mid.y;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isOrbiting = false;
        isPanning = false;
      } else if (e.touches.length === 1) {
        const t0 = e.touches.item(0);
        isOrbiting = true;
        isPanning = false;
        previousX = t0.clientX;
        previousY = t0.clientY;
      }
    });

    rebuildModelDropdown();
    buildHdrDropdown();
    applyRealismState();
    loadModel(0, true);
  }
  </script>
</body>

</html>

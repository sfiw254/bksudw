<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Dark Showroom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #131314;
      overflow: hidden;
      cursor: default;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e3e3e3;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: default; }

    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1e1f20;
      border: 1px solid #333537;
      color: #e3e3e3;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-arrow:hover {
      background: #2b2d2f;
      border-color: #8ab4f8;
      color: #8ab4f8;
    }
    #prevModelBig { left: 22px; }
    #nextModelBig { right: 22px; }

    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e1f20;
      border: 1px solid #333537;
      padding: 8px 14px;
      border-radius: 28px;
      z-index: 20;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 96vw;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: #333537;
    }

    .btn-sm {
      background: #282a2c;
      border: 1px solid #3c4043;
      color: #e3e3e3;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      white-space: nowrap;
    }
    .btn-sm:hover {
      background: #35373a;
      border-color: #8ab4f8;
    }
    .btn-sm.active {
      background: rgba(138, 180, 248, 0.18);
      border-color: #8ab4f8;
      color: #8ab4f8;
    }

    .icon-btn {
      width: 28px;
      padding: 0;
      font-size: 13px;
    }

    .label-text {
      font-size: 12px;
      font-weight: 500;
      color: #e3e3e3;
      min-width: 112px;
      text-align: center;
      white-space: nowrap;
    }

    .hdr-text {
      font-size: 12px;
      color: #c4c7c5;
      min-width: 126px;
      text-align: center;
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 76px;
      height: 4px;
      background: #3c4043;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #8ab4f8;
      cursor: pointer;
    }

    #loaderStatus {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1f20;
      border: 1px solid #333537;
      color: #c4c7c5;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 16px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #loaderStatus.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="loaderStatus">Loading 3D Model...</div>

  <button id="prevModelBig" class="nav-arrow" title="Previous Model">&#10094;</button>
  <button id="nextModelBig" class="nav-arrow" title="Next Model">&#10095;</button>

  <div class="bottom-bar">
    <div class="bar-group">
      <button id="prevModelSm" class="btn-sm icon-btn" title="Previous Model">&#10094;</button>
      <span id="modelLabel" class="label-text">Sci-Fi Helmet</span>
      <button id="nextModelSm" class="btn-sm icon-btn" title="Next Model">&#10095;</button>
    </div>

    <div class="divider"></div>

    <div class="bar-group">
      <button id="prevHdr" class="btn-sm icon-btn" title="Previous Lighting">&#10094;</button>
      <span id="hdrLabel" class="hdr-text">Studio Soft (Default)</span>
      <button id="nextHdr" class="btn-sm icon-btn" title="Next Lighting">&#10095;</button>
    </div>

    <div class="divider"></div>

    <div class="bar-group">
      <button id="autoRotBtn" class="btn-sm active" title="Toggle Auto Rotation">Auto</button>
      <input type="range" id="rotSpeedSlider" min="0" max="0.43" step="0.005" value="0.075" title="Rotation Speed">
    </div>

    <div class="divider"></div>

    <div class="bar-group">
      <label for="glbInput" class="btn-sm" style="cursor:pointer;">+ Load .GLB</label>
      <input type="file" id="glbInput" accept=".glb,.gltf" style="display:none;">
    </div>
  </div>

  <script>
    function loadScript(urls) {
      return new Promise((resolve, reject) => {
        let idx = 0;
        function tryNext() {
          if (idx >= urls.length) return reject(new Error('Failed to load script'));
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.onload = resolve;
          s.onerror = tryNext;
          document.head.appendChild(s);
        }
        tryNext();
      });
    }

    (async function bootstrap() {
      const statusEl = document.getElementById('loaderStatus');
      statusEl.textContent = 'Initializing 3D Engine...';
      statusEl.classList.add('visible');

      try {
        await loadScript([
          ['https:/', 'cdnjs.cloudflare.com', 'ajax', 'libs', 'three.js', 'r128', 'three.min.js'].join('/'),
          ['https:/', 'cdn.jsdelivr.net', 'npm', 'three@0.128.0', 'build', 'three.min.js'].join('/'),
          ['https:/', 'unpkg.com', 'three@0.128.0', 'build', 'three.min.js'].join('/')
        ]);
        await loadScript([
          ['https:/', 'cdn.jsdelivr.net', 'npm', 'three@0.128.0', 'examples', 'js', 'loaders', 'GLTFLoader.js'].join('/'),
          ['https:/', 'unpkg.com', 'three@0.128.0', 'examples', 'js', 'loaders', 'GLTFLoader.js'].join('/')
        ]);
        initApp();
      } catch (e) {
        statusEl.textContent = 'Error loading 3D Engine';
      }
    })();

    function initApp() {
      const statusEl = document.getElementById('loaderStatus');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x131314);

      const baseCameraZ = 330;
      const baseCameraY = 12;
      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(0, baseCameraY, baseCameraZ);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222630, 1.35);
      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(160, 260, 200);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x8ab4f8, 1.0);
      rimLight.position.set(-200, 140, -180);
      scene.add(rimLight);

      const fillLight = new THREE.DirectionalLight(0xffd2a6, 0.75);
      fillLight.position.set(120, -40, -150);
      scene.add(fillLight);

      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      const hdrPresets = [
        {
          name: 'Studio Soft (Default)',
          exposure: 1.05,
          envIntensity: 0.55,
          hemi: [0xffffff, 0x222630, 1.35],
          key: [0xffffff, 2.2],
          rim: [0x8ab4f8, 1.0],
          fill: [0xffd2a6, 0.75],
          panels: [
            { pos: [0, 80, 0], rot: [Math.PI / 2, 0, 0], size: [120, 120], color: 0xffffff },
            { pos: [90, 30, 60], rot: [0, -Math.PI / 3, 0], size: [70, 90], color: 0xf4f7ff },
            { pos: [-90, 20, -60], rot: [0, Math.PI / 3, 0], size: [70, 90], color: 0xd0e2ff }
          ]
        },
        {
          name: 'Golden Sunset',
          exposure: 1.12,
          envIntensity: 0.72,
          hemi: [0xffdfb8, 0x2a1d24, 1.25],
          key: [0xffa952, 2.6],
          rim: [0xff5e7e, 1.3],
          fill: [0x6b8cce, 0.7],
          panels: [
            { pos: [100, 25, 40], rot: [0, -Math.PI / 2.4, 0], size: [90, 90], color: 0xff9d3b },
            { pos: [-80, 50, -50], rot: [0, Math.PI / 3, 0], size: [100, 80], color: 0x4a6fa5 },
            { pos: [0, 90, 0], rot: [Math.PI / 2, 0, 0], size: [110, 110], color: 0xffd2a1 }
          ]
        },
        {
          name: 'Cyber Neon Night',
          exposure: 1.15,
          envIntensity: 0.8,
          hemi: [0x7dd3fc, 0x161224, 1.15],
          key: [0x38bdf8, 2.3],
          rim: [0xf43f5e, 1.65],
          fill: [0xa855f7, 0.95],
          panels: [
            { pos: [85, 30, 50], rot: [0, -Math.PI / 3, 0], size: [65, 100], color: 0x00f0ff },
            { pos: [-85, 25, -40], rot: [0, Math.PI / 3, 0], size: [65, 100], color: 0xff1e6e },
            { pos: [0, 85, 0], rot: [Math.PI / 2, 0, 0], size: [100, 100], color: 0x8b5cf6 }
          ]
        },
        {
          name: 'Overcast Outdoor',
          exposure: 1.02,
          envIntensity: 0.65,
          hemi: [0xdbeafe, 0x2b303a, 1.55],
          key: [0xf1f5f9, 1.9],
          rim: [0x93c5fd, 0.9],
          fill: [0xcbd5e1, 0.85],
          panels: [
            { pos: [0, 90, 0], rot: [Math.PI / 2, 0, 0], size: [160, 160], color: 0xe2e8f0 },
            { pos: [95, 35, 0], rot: [0, -Math.PI / 2, 0], size: [120, 80], color: 0xcbd5e1 },
            { pos: [-95, 35, 0], rot: [0, Math.PI / 2, 0], size: [120, 80], color: 0xdbeafe }
          ]
        },
        {
          name: 'Warm Garage Loft',
          exposure: 1.08,
          envIntensity: 0.68,
          hemi: [0xfef3c7, 0x1f1c18, 1.25],
          key: [0xfde68a, 2.35],
          rim: [0x60a5fa, 0.95],
          fill: [0xfdba74, 0.8],
          panels: [
            { pos: [0, 85, 20], rot: [Math.PI / 2.2, 0, 0], size: [130, 50], color: 0xfef08a },
            { pos: [80, 20, -60], rot: [0, -Math.PI / 4, 0], size: [70, 70], color: 0xfdba74 },
            { pos: [-85, 30, 50], rot: [0, Math.PI / 3, 0], size: [70, 70], color: 0x93c5fd }
          ]
        }
      ];

      let currentEnvRT = null;
      let currentHdrIdx = 0;

      function applyHdrPreset(idx) {
        currentHdrIdx = (idx + hdrPresets.length) % hdrPresets.length;
        const p = hdrPresets[currentHdrIdx];
        document.getElementById('hdrLabel').textContent = p.name;

        renderer.toneMappingExposure = p.exposure;
        hemiLight.color.setHex(p.hemi[0]);
        hemiLight.groundColor.setHex(p.hemi[1]);
        hemiLight.intensity = p.hemi[2];

        keyLight.color.setHex(p.key[0]);
        keyLight.intensity = p.key[1];
        rimLight.color.setHex(p.rim[0]);
        rimLight.intensity = p.rim[1];
        fillLight.color.setHex(p.fill[0]);
        fillLight.intensity = p.fill[1];

        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(p.hemi[1]);
        p.panels.forEach((pan) => {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(pan.size[0], pan.size[1]),
            new THREE.MeshBasicMaterial({ color: pan.color, side: THREE.DoubleSide })
          );
          m.position.set(pan.pos[0], pan.pos[1], pan.pos[2]);
          m.rotation.set(pan.rot[0], pan.rot[1], pan.rot[2]);
          envScene.add(m);
        });

        const newRT = pmrem.fromScene(envScene, 0.04);
        scene.environment = newRT.texture;
        if (currentEnvRT) currentEnvRT.dispose();
        currentEnvRT = newRT;

        if (activeModel) {
          activeModel.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.envMapIntensity = p.envIntensity;
              child.material.needsUpdate = true;
            }
          });
        }
      }

      const stageGroup = new THREE.Group();
      stageGroup.position.y = 14;
      scene.add(stageGroup);

      const models = [
        {
          name: 'Sci-Fi Helmet',
          url: ['https:/', 'raw.githubusercontent.com', 'KhronosGroup', 'glTF-Sample-Assets', 'main', 'Models', 'SciFiHelmet', 'glTF', 'SciFiHelmet.gltf'].join('/')
        },
        {
          name: 'Damaged Helmet',
          url: ['https:/', 'raw.githubusercontent.com', 'KhronosGroup', 'glTF-Sample-Assets', 'main', 'Models', 'DamagedHelmet', 'glTF-Binary', 'DamagedHelmet.glb'].join('/')
        }
      ];

      let currentModelIdx = 0;
      let activeModel = null;
      const gltfLoader = new THREE.GLTFLoader();

      function loadModel(idx) {
        currentModelIdx = (idx + models.length) % models.length;
        const item = models[currentModelIdx];
        document.getElementById('modelLabel').textContent = item.name;
        statusEl.textContent = 'Loading ' + item.name + '...';
        statusEl.classList.add('visible');

        gltfLoader.load(
          item.url,
          (gltf) => {
            if (activeModel) {
              stageGroup.remove(activeModel);
            }
            const root = gltf.scene;
            const box = new THREE.Box3().setFromObject(root);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const scale = 115 / maxDim;
            root.scale.setScalar(scale);

            const scaledBox = new THREE.Box3().setFromObject(root);
            const center = new THREE.Vector3();
            scaledBox.getCenter(center);
            root.position.sub(center);
            root.position.y += 12;

            const envInt = hdrPresets[currentHdrIdx].envIntensity;
            root.traverse((child) => {
              if (child.isMesh && child.material) {
                child.material.envMapIntensity = envInt;
                child.material.needsUpdate = true;
              }
            });

            activeModel = root;
            stageGroup.add(activeModel);
            statusEl.classList.remove('visible');
          },
          undefined,
          () => {
            statusEl.textContent = 'Failed to load ' + item.name;
          }
        );
      }

      document.getElementById('prevModelBig').addEventListener('click', () => loadModel(currentModelIdx - 1));
      document.getElementById('nextModelBig').addEventListener('click', () => loadModel(currentModelIdx + 1));
      document.getElementById('prevModelSm').addEventListener('click', () => loadModel(currentModelIdx - 1));
      document.getElementById('nextModelSm').addEventListener('click', () => loadModel(currentModelIdx + 1));

      document.getElementById('prevHdr').addEventListener('click', () => applyHdrPreset(currentHdrIdx - 1));
      document.getElementById('nextHdr').addEventListener('click', () => applyHdrPreset(currentHdrIdx + 1));

      document.getElementById('glbInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const blobUrl = URL.createObjectURL(file);
        const cleanName = file.name.replace(/\.[^/.]+$/, '');
        models.push({ name: cleanName, url: blobUrl });
        loadModel(models.length - 1);
        e.target.value = '';
      });

      let isOrbiting = false;
      let isPanning = false;
      let previousX = 0;
      let previousY = 0;
      let yaw = 30;
      let pitch = -14;
      let zoomZ = 105;
      let panX = 0;
      let panY = 0;
      let initialPinchDistance = 0;
      let initialZoomZ = 105;

      const minZoom = -450;
      const maxZoom = 290;

      // Dynamic precision factor: scales smoothly from 1.0 (default/zoomed out) down to ~0.18 at max zoom
      function getZoomPrecisionFactor() {
        const normalizedZoom = Math.max(0, (zoomZ - 40) / (maxZoom - 40));
        return Math.max(0.18, 1.0 - normalizedZoom * 0.82);
      }

      let autoRotate = true;
      const speedSlider = document.getElementById('rotSpeedSlider');
      let rotSpeed = parseFloat(speedSlider.value);
      const autoBtn = document.getElementById('autoRotBtn');

      autoBtn.addEventListener('click', () => {
        autoRotate = !autoRotate;
        autoBtn.classList.toggle('active', autoRotate);
      });

      speedSlider.addEventListener('input', (e) => {
        rotSpeed = parseFloat(e.target.value);
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') loadModel(currentModelIdx - 1);
        else if (e.code === 'ArrowRight') loadModel(currentModelIdx + 1);
        else if (e.code === 'Space') {
          e.preventDefault();
          autoRotate = !autoRotate;
          autoBtn.classList.toggle('active', autoRotate);
        }
      });

      function renderLoop() {
        const precision = getZoomPrecisionFactor();
        if (autoRotate && !isOrbiting && !isPanning && rotSpeed > 0) {
          yaw += rotSpeed * precision;
        }
        const deg = Math.PI / 180;
        stageGroup.rotation.order = 'XYZ';
        stageGroup.rotation.x = -pitch * deg;
        stageGroup.rotation.y = yaw * deg;

        camera.position.x = -panX;
        camera.position.y = baseCameraY + panY;
        camera.position.z = baseCameraZ - zoomZ;

        renderer.render(scene, camera);
        requestAnimationFrame(renderLoop);
      }
      requestAnimationFrame(renderLoop);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const canvas = renderer.domElement;

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          isOrbiting = true;
          previousX = e.clientX;
          previousY = e.clientY;
        } else if (e.button === 1) {
          e.preventDefault();
          isPanning = true;
          previousX = e.clientX;
          previousY = e.clientY;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isOrbiting) {
          const precision = getZoomPrecisionFactor();
          yaw += (e.clientX - previousX) * 0.45 * precision;
          pitch = Math.max(-85, Math.min(85, pitch - (e.clientY - previousY) * 0.45 * precision));
          previousX = e.clientX;
          previousY = e.clientY;
        } else if (isPanning) {
          const precision = getZoomPrecisionFactor();
          panX += (e.clientX - previousX) * 0.14 * precision;
          panY += (e.clientY - previousY) * 0.14 * precision;
          previousX = e.clientX;
          previousY = e.clientY;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 0) isOrbiting = false;
        if (e.button === 1) isPanning = false;
      });

      window.addEventListener('mouseleave', () => {
        isOrbiting = false;
        isPanning = false;
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const clampedDelta = Math.max(-100, Math.min(100, e.deltaY));
        zoomZ = Math.max(minZoom, Math.min(maxZoom, zoomZ - clampedDelta * 0.12));
      }, { passive: false });

      function getTouchDistance(t) {
        const t0 = t.item(0);
        const t1 = t.item(1);
        return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      }

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          const t0 = e.touches.item(0);
          isOrbiting = true;
          previousX = t0.clientX;
          previousY = t0.clientY;
        } else if (e.touches.length === 2) {
          isOrbiting = false;
          initialPinchDistance = getTouchDistance(e.touches);
          initialZoomZ = zoomZ;
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isOrbiting) {
          const t0 = e.touches.item(0);
          const precision = getZoomPrecisionFactor();
          yaw += (t0.clientX - previousX) * 0.45 * precision;
          pitch = Math.max(-85, Math.min(85, pitch - (t0.clientY - previousY) * 0.45 * precision));
          previousX = t0.clientX;
          previousY = t0.clientY;
        } else if (e.touches.length === 2 && initialPinchDistance > 0) {
          zoomZ = Math.max(minZoom, Math.min(maxZoom, initialZoomZ + (getTouchDistance(e.touches) - initialPinchDistance) * 0.55));
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          isOrbiting = false;
        } else if (e.touches.length === 1) {
          const t0 = e.touches.item(0);
          isOrbiting = true;
          previousX = t0.clientX;
          previousY = t0.clientY;
        }
      });

      applyHdrPreset(0);
      loadModel(0);
    }
  </script>
</body>
</html>

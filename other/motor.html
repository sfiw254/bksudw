<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Turntable Motorcycle</title>
  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 45%, #1d2228 0%, #0b0d10 100%);
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body:active {
    cursor: grabbing;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  </style>
</head>

<body>
  <script>
  const s = document.createElement('script');
  s.src = ['https:/', 'cdnjs.cloudflare.com', 'ajax', 'libs', 'three.js', 'r128', 'three.min.js'].join('/');
  s.onload = initApp;
  document.head.appendChild(s);

  function initApp() {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 2000);
    const baseCameraZ = 330;
    camera.position.set(0, 15, baseCameraZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x222630, 1.5));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(160, 260, 200);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00ffcc, 1.4);
    rimLight.position.set(-200, 140, -180);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xffaa66, 0.9);
    fillLight.position.set(120, -40, -150);
    scene.add(fillLight);

    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(135, 142, 6, 96),
      new THREE.MeshStandardMaterial({ color: 0x181c24, metalness: 0.7, roughness: 0.25 })
    );
    platform.position.y = -58;
    stageGroup.add(platform);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(138, 1.1, 16, 120),
      new THREE.MeshBasicMaterial({ color: 0x00ffcc })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -55;
    stageGroup.add(ring);

    let isDragging = false,
      previousX = 0,
      previousY = 0;
    let yaw = 30,
      pitch = -20,
      zoomZ = 0;
    let initialPinchDistance = 0,
      initialZoomZ = 0;
    let needsRender = true;

    function renderLoop() {
      if (needsRender) {
        const deg = Math.PI / 180;
        stageGroup.rotation.order = 'XYZ';
        stageGroup.rotation.x = -pitch * deg;
        stageGroup.rotation.y = yaw * deg;
        camera.position.z = baseCameraZ - zoomZ;
        renderer.render(scene, camera);
        needsRender = false;
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      needsRender = true;
    });

    document.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDragging = true;
        previousX = e.clientX;
        previousY = e.clientY;
      }
    });
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      yaw += (e.clientX - previousX) * 0.5;
      pitch = Math.max(-85, Math.min(85, pitch - (e.clientY - previousY) * 0.5));
      needsRender = true;
      previousX = e.clientX;
      previousY = e.clientY;
    });
    document.addEventListener('mouseup', (e) => { if (e.button === 0) isDragging = false; });
    document.addEventListener('mouseleave', () => { isDragging = false; });

    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomZ = Math.max(-450, Math.min(115, zoomZ - e.deltaY * 0.35));
      needsRender = true;
    }, { passive: false });

    function getTouchDistance(t) {
      const t0 = t.item(0);
      const t1 = t.item(1);
      return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    }
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const t0 = e.touches.item(0);
        isDragging = true;
        previousX = t0.clientX;
        previousY = t0.clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getTouchDistance(e.touches);
        initialZoomZ = zoomZ;
      }
    }, { passive: false });
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        const t0 = e.touches.item(0);
        yaw += (t0.clientX - previousX) * 0.5;
        pitch = Math.max(-85, Math.min(85, pitch - (t0.clientY - previousY) * 0.5));
        needsRender = true;
        previousX = t0.clientX;
        previousY = t0.clientY;
      } else if (e.touches.length === 2 && initialPinchDistance > 0) {
        zoomZ = Math.max(-450, Math.min(115, initialZoomZ + (getTouchDistance(e.touches) - initialPinchDistance) * 1.2));
        needsRender = true;
      }
    }, { passive: false });
    document.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) isDragging = false;
      else if (e.touches.length === 1) {
        const t0 = e.touches.item(0);
        isDragging = true;
        previousX = t0.clientX;
        previousY = t0.clientY;
      }
    });
    const bike = new THREE.Group();
    bike.position.y = -21;
    stageGroup.add(bike);

    const paintMat = new THREE.MeshPhysicalMaterial({ color: 0xd91424, metalness: 0.45, roughness: 0.16, clearcoat: 1.0 });
    const carbonMat = new THREE.MeshStandardMaterial({ color: 0x1b1d21, metalness: 0.25, roughness: 0.42 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2e35, metalness: 0.85, roughness: 0.28 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf4f6f8, metalness: 0.98, roughness: 0.08 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4a024, metalness: 0.9, roughness: 0.22 });
    const titaniumMat = new THREE.MeshStandardMaterial({ color: 0x9b8e7e, metalness: 0.88, roughness: 0.25 });
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x141517, metalness: 0.05, roughness: 0.82 });
    const seatMat = new THREE.MeshStandardMaterial({ color: 0x191a1d, metalness: 0.05, roughness: 0.65 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x111820, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.55 });
    const headGlow = new THREE.MeshBasicMaterial({ color: 0xe6f8ff });
    const tailGlow = new THREE.MeshBasicMaterial({ color: 0xff1a1a });

    function createWheel(radius, width, isFront) {
      const g = new THREE.Group();
      const pts = [];
      const innerR = radius - width * 0.62;
      for (let i = 0; i <= 28; i++) {
        const t = (i / 28) * Math.PI;
        pts.push(new THREE.Vector2(innerR + Math.sin(t) * (radius - innerR), -Math.cos(t) * (width * 0.5)));
      }
      const tireGeo = new THREE.LatheGeometry(pts, 64);
      tireGeo.rotateX(Math.PI / 2);
      g.add(new THREE.Mesh(tireGeo, rubberMat));

      const rimGeo = new THREE.CylinderGeometry(innerR + 0.5, innerR + 0.5, width * 0.72, 64, 1, true);
      rimGeo.rotateX(Math.PI / 2);
      g.add(new THREE.Mesh(rimGeo, frameMat));

      const stripeGeo = new THREE.TorusGeometry(innerR + 0.3, 0.35, 12, 64);
      [-1, 1].forEach((s) => {
        const st = new THREE.Mesh(stripeGeo, paintMat);
        st.position.z = s * width * 0.36;
        g.add(st);
      });

      const hubGeo = new THREE.CylinderGeometry(5.5, 5.5, width * 0.78, 32);
      hubGeo.rotateX(Math.PI / 2);
      g.add(new THREE.Mesh(hubGeo, frameMat));

      for (let i = 0; i < 5; i++) {
        const base = (i / 5) * Math.PI * 2;
        [-0.14, 0.14].forEach((off) => {
          const a = base + off,
            len = innerR - 4.5;
          const sp = new THREE.Mesh(new THREE.BoxGeometry(1.3, len, 1.8), frameMat);
          sp.position.set(Math.cos(a) * (4.5 + len * 0.5), Math.sin(a) * (4.5 + len * 0.5), 0);
          sp.rotation.z = a - Math.PI / 2;
          g.add(sp);
        });
      }

      const sides = isFront ? [width * 0.38, -width * 0.38] : [width * 0.38];
      const rRad = isFront ? radius * 0.68 : radius * 0.54;
      sides.forEach((zPos) => {
        const rotor = new THREE.Mesh(
          new THREE.RingGeometry(rRad * 0.72, rRad, 64),
          new THREE.MeshStandardMaterial({ color: 0xd0d5dd, metalness: 0.92, roughness: 0.18, side: THREE.DoubleSide })
        );
        rotor.position.z = zPos;
        const carrier = new THREE.Mesh(new THREE.RingGeometry(5.5, rRad * 0.72, 48), goldMat);
        carrier.position.z = zPos * 0.96;
        const caliper = new THREE.Mesh(new THREE.BoxGeometry(5.5, 8.5, 3.6), goldMat);
        caliper.position.set(isFront ? -rRad * 0.78 : rRad * 0.72, rRad * 0.35, zPos);
        caliper.rotation.z = isFront ? 0.4 : -0.4;
        g.add(rotor, carrier, caliper);
      });

      if (!isFront) {
        const sprGeo = new THREE.CylinderGeometry(11.5, 11.5, 1.2, 48);
        sprGeo.rotateX(Math.PI / 2);
        const spr = new THREE.Mesh(sprGeo, titaniumMat);
        spr.position.z = -width * 0.42;
        g.add(spr);
      }
      return g;
    }

    function createTube(pts, r, mat, segs = 36) {
      return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), segs, r, 14, false), mat);
    }

    const rearWheel = createWheel(34, 20, false);
    rearWheel.position.set(-72, 0, 0);
    const frontWheel = createWheel(33, 13, true);
    frontWheel.position.set(72, -1, 0);
    bike.add(rearWheel, frontWheel);

    [-11.5, 11.5].forEach((z) => {
      bike.add(createTube([new THREE.Vector3(-72, 0, z), new THREE.Vector3(-48, 5, z * 0.9), new THREE.Vector3(-22, 8, z * 0.75)], 2.4, frameMat, 20));
    });

    const shock = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 22, 20), goldMat);
    shock.position.set(-30, 17, 0);
    shock.rotation.z = -0.52;
    bike.add(shock);

    const springCurve = new THREE.CatmullRomCurve3(Array.from({ length: 40 }, (_, i) => {
      const t = i / 39,
        a = t * Math.PI * 10;
      return new THREE.Vector3(Math.cos(a) * 3.1, (t - 0.5) * 14, Math.sin(a) * 3.1);
    }));
    const spring = new THREE.Mesh(new THREE.TubeGeometry(springCurve, 64, 0.65, 8, false), paintMat);
    spring.position.copy(shock.position);
    spring.rotation.copy(shock.rotation);
    bike.add(spring);

    bike.add(
      createTube([new THREE.Vector3(-72, 11.2, -8.5), new THREE.Vector3(-22, 12.5, -8.5)], 0.7, goldMat, 10),
      createTube([new THREE.Vector3(-72, -11.2, -8.5), new THREE.Vector3(-22, 3.5, -8.5)], 0.7, goldMat, 10)
    );

    [-8.5, 8.5].forEach((z) => {
      bike.add(
        createTube([new THREE.Vector3(-22, 10, z), new THREE.Vector3(4, 28, z * 0.85), new THREE.Vector3(34, 42, z * 0.55)], 1.6, paintMat, 20),
        createTube([new THREE.Vector3(-20, 8, z), new THREE.Vector3(10, 16, z * 0.9), new THREE.Vector3(34, 34, z * 0.55)], 1.4, paintMat, 20),
        createTube([new THREE.Vector3(-4, 24, z * 0.88), new THREE.Vector3(10, 16, z * 0.9)], 1.1, paintMat, 8),
        createTube([new THREE.Vector3(-18, 25, z * 0.75), new THREE.Vector3(-46, 37, z * 0.55), new THREE.Vector3(-76, 48, z * 0.3)], 1.3, frameMat, 16),
        createTube([new THREE.Vector3(-22, 12, z * 0.8), new THREE.Vector3(-52, 31, z * 0.55), new THREE.Vector3(-76, 48, z * 0.3)], 1.1, frameMat, 16)
      );
    });

    const eng = new THREE.Group();
    eng.position.set(2, 6, 0);
    eng.add(new THREE.Mesh(new THREE.BoxGeometry(28, 17, 19), frameMat));
    const clutch = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 22, 32), titaniumMat);
    clutch.rotation.x = Math.PI / 2;
    clutch.position.set(-4, -1, 0);
    const cyl = new THREE.Mesh(new THREE.BoxGeometry(16, 15, 17), carbonMat);
    cyl.position.set(6, 12, 0);
    cyl.rotation.z = -0.35;
    const valve = new THREE.Mesh(new THREE.BoxGeometry(17.5, 3.5, 18), paintMat);
    valve.position.set(8.5, 19, 0);
    valve.rotation.z = -0.35;
    const rad = new THREE.Mesh(new THREE.BoxGeometry(3.2, 22, 21), carbonMat);
    rad.position.set(26, 15, 0);
    rad.rotation.z = -0.32;
    eng.add(clutch, cyl, valve, rad);
    bike.add(eng);

    [-5.5, -1.8, 1.8, 5.5].forEach((zOff, idx) => {
      bike.add(createTube([
        new THREE.Vector3(14, 16, zOff), new THREE.Vector3(24 + idx * 0.4, 6, zOff * 1.1),
        new THREE.Vector3(16, -11, zOff * 0.8), new THREE.Vector3(-12, -12, 4)
      ], 1.35, titaniumMat, 30));
    });
    const collector = new THREE.Mesh(new THREE.BoxGeometry(18, 6, 10), titaniumMat);
    collector.position.set(-16, -11, 3);
    bike.add(collector, createTube([new THREE.Vector3(-22, -10, 6), new THREE.Vector3(-34, -4, 11.5)], 1.8, titaniumMat, 12));

    const muffler = new THREE.Group();
    muffler.position.set(-46, 5, 13);
    muffler.rotation.set(0, -0.06, 0.58);
    const mBody = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.1, 24, 32), titaniumMat);
    mBody.rotation.z = Math.PI / 2;
    const mTip = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3.6, 5, 32), carbonMat);
    mTip.rotation.z = Math.PI / 2;
    mTip.position.x = -14.5;
    muffler.add(mBody, mTip);
    bike.add(muffler);
    const fork = new THREE.Group();
    fork.position.set(53, 21, 0);
    fork.rotation.z = 0.41;
    [-7.8, 7.8].forEach((z) => {
      const outer = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 44, 24), goldMat);
      outer.position.set(0, 12, z);
      const inner = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 1.65, 34, 24), chromeMat);
      inner.position.set(0, -14, z);
      fork.add(outer, inner);
    });
    const uClamp = new THREE.Mesh(new THREE.BoxGeometry(5.5, 2.2, 19), frameMat);
    uClamp.position.set(0, 29, 0);
    const lClamp = new THREE.Mesh(new THREE.BoxGeometry(6.0, 2.6, 19), frameMat);
    lClamp.position.set(0, 14, 0);
    fork.add(uClamp, lClamp);

    [-1, 1].forEach((s) => {
      fork.add(createTube([new THREE.Vector3(0, 27.5, s * 7.8), new THREE.Vector3(-4.5, 25.5, s * 19.5)], 1.15, frameMat, 10));
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(1.45, 1.45, 8.5, 20), rubberMat);
      grip.rotation.set(Math.PI / 2, s * 0.35, 0);
      grip.position.set(-3.2, 26.1, s * 16.5);
      const lever = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 8), frameMat);
      lever.position.set(0.5, 26.2, s * 16.8);
      lever.rotation.y = s * 0.55;
      fork.add(grip, lever);
    });
    bike.add(fork);

    const fenderGeo = new THREE.CylinderGeometry(35.2, 35.2, 12, 40, 1, true, 0.3, 1.55);
    fenderGeo.rotateX(Math.PI / 2);
    const fender = new THREE.Mesh(fenderGeo, carbonMat);
    fender.position.copy(frontWheel.position);
    bike.add(fender);

    const tankShape = new THREE.Shape();
    tankShape.moveTo(-20, 25);
    tankShape.bezierCurveTo(-18, 36, -6, 46, 12, 46);
    tankShape.bezierCurveTo(25, 46, 32, 39, 34, 33);
    tankShape.bezierCurveTo(22, 29, 4, 26, -20, 25);
    const tankGeo = new THREE.ExtrudeGeometry(tankShape, { depth: 16, bevelEnabled: true, bevelSegments: 10, bevelSize: 4.5, bevelThickness: 5.5 });
    tankGeo.translate(0, 0, -8);
    bike.add(new THREE.Mesh(tankGeo, paintMat));

    const cap = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 1.2, 24), titaniumMat);
    cap.position.set(10, 50.8, 0);
    cap.rotation.z = -0.15;
    bike.add(cap);

    const seatShape = new THREE.Shape();
    seatShape.moveTo(-46, 32);
    seatShape.bezierCurveTo(-36, 26, -24, 24, -15, 26);
    seatShape.lineTo(-15, 30);
    seatShape.bezierCurveTo(-26, 29, -37, 31, -46, 36);
    const seatGeo = new THREE.ExtrudeGeometry(seatShape, { depth: 12, bevelEnabled: true, bevelSegments: 6, bevelSize: 2.2, bevelThickness: 2.5 });
    seatGeo.translate(0, 0, -6);
    bike.add(new THREE.Mesh(seatGeo, seatMat));

    const tailShape = new THREE.Shape();
    tailShape.moveTo(-36, 32);
    tailShape.bezierCurveTo(-52, 37, -68, 44, -84, 51);
    tailShape.lineTo(-81, 54);
    tailShape.bezierCurveTo(-65, 49, -50, 44, -38, 38);
    const tailGeo = new THREE.ExtrudeGeometry(tailShape, { depth: 11, bevelEnabled: true, bevelSegments: 8, bevelSize: 2.4, bevelThickness: 3.2 });
    tailGeo.translate(0, 0, -5.5);
    bike.add(new THREE.Mesh(tailGeo, paintMat));

    const tailLight = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.2, 9), tailGlow);
    tailLight.position.set(-83.5, 52, 0);
    tailLight.rotation.z = 0.4;
    bike.add(tailLight);

    const fairShape = new THREE.Shape();
    fairShape.moveTo(4, 2);
    fairShape.bezierCurveTo(22, 0, 42, 8, 56, 28);
    fairShape.bezierCurveTo(50, 41, 36, 46, 24, 43);
    fairShape.bezierCurveTo(18, 32, 10, 22, 2, 16);
    fairShape.closePath();
    const fairingGeo = new THREE.ExtrudeGeometry(fairShape, { depth: 18, bevelEnabled: true, bevelSegments: 10, bevelSize: 3.5, bevelThickness: 4.5 });
    fairingGeo.translate(0, 0, -9);
    bike.add(new THREE.Mesh(fairingGeo, paintMat));

    const belly = new THREE.Mesh(new THREE.BoxGeometry(36, 8, 17), carbonMat);
    belly.position.set(4, -5, 0);
    belly.rotation.z = 0.14;
    bike.add(belly);

    [-1, 1].forEach((s) => {
      const wing = new THREE.Mesh(new THREE.BoxGeometry(11, 1.2, 7.5), carbonMat);
      wing.position.set(44, 26, s * 14.5);
      wing.rotation.set(s * 0.15, 0, -0.18);
      const mHead = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 6.5), carbonMat);
      mHead.position.set(47, 51.5, s * 19.5);
      mHead.rotation.y = s * -0.25;
      const drl = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.4, 5.5), headGlow);
      drl.position.set(56.5, 31, s * 5.2);
      drl.rotation.set(0, s * -0.35, -0.35);
      bike.add(wing, createTube([new THREE.Vector3(44, 43, s * 7), new THREE.Vector3(47, 51, s * 17)], 0.7, carbonMat, 8), mHead, drl);
    });

    const screen = new THREE.Mesh(new THREE.SphereGeometry(14, 32, 24, 0, Math.PI * 0.55, 0.2, 1.1), glassMat);
    screen.scale.set(1.35, 0.85, 0.92);
    screen.position.set(35, 42, 0);
    screen.rotation.z = -0.55;
    bike.add(screen);

    [-11.5, 11.5].forEach((z) => {
      const brk = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 1.2), titaniumMat);
      brk.position.set(-22, 4, z);
      const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 5, 12), chromeMat);
      peg.rotation.x = Math.PI / 2;
      peg.position.set(-24, 2, z + (z > 0 ? 2.5 : -2.5));
      bike.add(brk, peg);
    });

    bike.add(createTube([new THREE.Vector3(-12, -5, -9), new THREE.Vector3(-22, -33, -16)], 1.1, frameMat, 8));
    needsRender = true;
  }
  </script>
</body>

</html>

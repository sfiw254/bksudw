<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remote Cam</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #0b0b0b;
        color: #ffffff;
        font-family: Arial, sans-serif;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #loginScreen {
        background: #1a1a1a;
        padding: 25px 20px;
        border-radius: 12px;
        text-align: center;
        width: 90%;
        max-width: 360px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      h1 {
        color: #e91e63;
        margin: 0 0 20px 0;
        font-size: 1.6rem;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #333;
        background: #2b2b2b;
        color: white;
        border-radius: 8px;
        text-align: center;
        font-size: 1rem;
        margin-bottom: 12px;
      }

      .action-btn {
        width: 100%;
        background: #e91e63;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
      }

      #callScreen {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
      }

      #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      #localVideo {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 28vw;
        max-width: 180px;
        min-width: 100px;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: #1a1a1a;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        transform: scaleX(-1);
        z-index: 10;
      }

      @media (min-width: 768px) {
        #localVideo {
          aspect-ratio: 16 / 9;
          max-width: 220px;
        }
      }

      .top-bar {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }

      #status {
        background: rgba(0, 0, 0, 0.65);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 0.9rem;
        margin: 0;
      }

      #hangupBtn {
        pointer-events: auto;
        background: #f44336;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
    <script>
      const s = document.createElement("script")
      s.src = "htt" + "ps://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
      document.head.appendChild(s)
    </script>
  </head>

  <body>
    <div id="loginScreen">
      <h1>Remote Cam</h1>
      <input type="text" id="room-id" placeholder="Внеси име на соба" />
      <button id="connectBtn" class="action-btn">Влези во соба</button>
    </div>

    <div id="callScreen">
      <div class="top-bar">
        <p id="status">Се поврзувам...</p>
        <button id="hangupBtn">Излези</button>
      </div>
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script>
      const roomIdInput = document.getElementById("room-id")
      const connectBtn = document.getElementById("connectBtn")
      const hangupBtn = document.getElementById("hangupBtn")
      const statusDisplay = document.getElementById("status")
      const loginScreen = document.getElementById("loginScreen")
      const callScreen = document.getElementById("callScreen")
      const localVideo = document.getElementById("localVideo")
      const remoteVideo = document.getElementById("remoteVideo")

      let peer = null
      let localStream = null
      let currentCall = null

      connectBtn.addEventListener("click", async () => {
        const roomName = roomIdInput.value.trim().toLowerCase()
        if (!roomName) return alert("Внеси име на соба!")

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
          localVideo.srcObject = localStream
        } catch (err) {
          return alert("Нема пристап до камера/микрофон!")
        }

        loginScreen.style.display = "none"
        callScreen.style.display = "block"
        statusDisplay.textContent = "Се поврзувам..."

        joinRoom(roomName)
      })

      function joinRoom(roomName) {
        if (peer) {
          peer.destroy()
          peer = null
        }

        peer = new Peer(roomName)

        peer.on("open", (id) => {
          statusDisplay.textContent = "Соба: " + id + " (Чекаме партнер...)"
          statusDisplay.style.color = "#ffb300"
        })

        peer.on("error", (err) => {
          if (err.type === "unavailable-id") {
            statusDisplay.textContent = "Се поврзувам со партнерот..."
            peer.destroy()

            peer = new Peer()
            peer.on("open", () => {
              const call = peer.call(roomName, localStream)
              setupCall(call)
            })
          } else {
            statusDisplay.textContent = "Мрежна грешка."
            statusDisplay.style.color = "#f44336"
          }
        })

        peer.on("call", (call) => {
          if (currentCall) currentCall.close()
          call.answer(localStream)
          setupCall(call)
        })
      }

      function setupCall(call) {
        currentCall = call

        call.on("stream", (remoteStream) => {
          remoteVideo.srcObject = remoteStream
          statusDisplay.textContent = "Поврзан"
          statusDisplay.style.color = "#4caf50"
        })

        call.on("close", () => {
          remoteVideo.srcObject = null
          currentCall = null
          // Ако бевме гостин (без главното име), преземи ја собата за партнерот да може пак да се врати
          if (peer && peer.id !== roomIdInput.value.trim().toLowerCase()) {
            joinRoom(roomIdInput.value.trim().toLowerCase())
          } else {
            statusDisplay.textContent = "Партнерот излезе. Чекаме пак..."
            statusDisplay.style.color = "#ffb300"
          }
        })
      }

      hangupBtn.addEventListener("click", () => {
        if (currentCall) {
          currentCall.close()
          currentCall = null
        }
        if (peer) {
          peer.disconnect()
          peer.destroy()
          peer = null
        }
        if (localStream) {
          localStream.getTracks().forEach((t) => t.stop())
          localStream = null
        }
        remoteVideo.srcObject = null
        localVideo.srcObject = null
        callScreen.style.display = "none"
        loginScreen.style.display = "block"
      })

      window.addEventListener("beforeunload", () => {
        if (peer) peer.destroy()
      })
    </script>
  </body>
</html>

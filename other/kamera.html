<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remote Cam</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #0b0b0b;
        color: #ffffff;
        font-family: Arial, sans-serif;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #loginScreen {
        background: #1a1a1a;
        padding: 25px 20px;
        border-radius: 12px;
        text-align: center;
        width: 90%;
        max-width: 360px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      h1 {
        color: #e91e63;
        margin: 0 0 20px 0;
        font-size: 1.6rem;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #333;
        background: #2b2b2b;
        color: white;
        border-radius: 8px;
        text-align: center;
        font-size: 1rem;
        margin-bottom: 12px;
      }

      .action-btn {
        width: 100%;
        background: #e91e63;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
      }

      #callScreen {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
      }

      #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      #localVideo {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 28vw;
        max-width: 180px;
        min-width: 100px;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: #1a1a1a;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        transform: scaleX(-1);
        z-index: 10;
      }

      @media (min-width: 768px) {
        #localVideo {
          aspect-ratio: 16 / 9;
          max-width: 220px;
        }
      }

      .top-bar {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }

      #status {
        background: rgba(0, 0, 0, 0.65);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 0.9rem;
        margin: 0;
      }
      .status-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #retryBtn {
        display: none;
        pointer-events: auto;
        background: #4caf50;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
      }
      #hangupBtn {
        pointer-events: auto;
        background: #f44336;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  </head>

  <body>
    <div id="loginScreen">
      <h1>Remote Cam</h1>
      <input type="text" id="room-id" placeholder="Внеси име на соба" />
      <button id="connectBtn" class="action-btn">Влези во соба</button>
    </div>

    <div id="callScreen">
      <div class="top-bar">
        <p id="status">Поврзување...</p>
        <button id="retryBtn">Поврзи се</button>
        <button id="hangupBtn">Излези</button>
      </div>
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script>
      const roomIdInput = document.getElementById("room-id")
      const connectBtn = document.getElementById("connectBtn")
      const retryBtn = document.getElementById("retryBtn")
      const hangupBtn = document.getElementById("hangupBtn")
      const statusDisplay = document.getElementById("status")
      const loginScreen = document.getElementById("loginScreen")
      const callScreen = document.getElementById("callScreen")
      const localVideo = document.getElementById("localVideo")
      const remoteVideo = document.getElementById("remoteVideo")

      let peer = null
      let localStream = null
      let currentCall = null
      let dataConn = null
      let heartbeatTimer = null
      let lastPongTime = 0

      connectBtn.addEventListener("click", async () => {
        const roomName = roomIdInput.value.trim().toLowerCase()
        if (!roomName) return alert("Внеси име на соба!")

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
          localVideo.srcObject = localStream
        } catch (err) {
          return alert("Нема пристап до камера/микрофон!")
        }

        loginScreen.style.display = "none"
        callScreen.style.display = "block"
        statusDisplay.textContent = "Поврзување..."

        joinRoom(roomName)
      })

      retryBtn.addEventListener("click", () => {
        const roomName = roomIdInput.value.trim().toLowerCase()
        if (!roomName) return

        retryBtn.style.display = "none"
        statusDisplay.textContent = "Поврзување..."
        statusDisplay.style.color = "#ffffff"

        joinRoom(roomName)
      })

      function joinRoom(roomName) {
        retryBtn.style.display = "none"
        if (peer) {
          peer.destroy()
          peer = null
        }

        peer = new Peer(roomName)

        peer.on("open", (id) => {
          retryBtn.style.display = "none"
          statusDisplay.textContent = "Чекам соговорник..."
          statusDisplay.style.color = "#ffb300"
        })

        peer.on("error", (err) => {
          if (err.type === "unavailable-id") {
            statusDisplay.textContent = "Поврзување..."
            peer.destroy()

            peer = new Peer()
            peer.on("open", () => {
              const call = peer.call(roomName, localStream)
              setupCall(call)
              const conn = peer.connect(roomName)
              setupDataConn(conn)
            })
          } else {
            statusDisplay.textContent = "Мрежна грешка."
            statusDisplay.style.color = "#f44336"
            retryBtn.style.display = "inline-block"
          }
        })

        peer.on("call", (call) => {
          if (currentCall) currentCall.close()
          call.answer(localStream)
          setupCall(call)
        })

        peer.on("connection", (conn) => {
          setupDataConn(conn)
        })
      }

      function stopHeartbeat() {
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer)
          heartbeatTimer = null
        }
      }

      function startHeartbeat() {
        stopHeartbeat()
        lastPongTime = Date.now()
        heartbeatTimer = setInterval(() => {
          if (!dataConn || !dataConn.open) return
          if (Date.now() - lastPongTime > 2500) {
            handlePartnerLeave()
            return
          }
          try {
            dataConn.send({ type: "ping" })
          } catch (e) {}
        }, 1000)
      }

      function setupDataConn(conn) {
        dataConn = conn
        conn.on("open", () => {
          startHeartbeat()
          if (document.hidden) {
            conn.send({ type: "minimized", status: true })
          }
        })
        conn.on("data", (data) => {
          lastPongTime = Date.now()
          if (data.type === "ping") {
            if (conn.open) conn.send({ type: "pong" })
          } else if (data.type === "minimized") {
            remoteVideo.style.visibility = data.status ? "hidden" : "visible"
            statusDisplay.textContent = data.status ? "Соговорникот е на пауза (минимизиран)" : "Поврзан"
            statusDisplay.style.color = data.status ? "#ffb300" : "#4caf50"
          } else if (data.type === "bye") {
            handlePartnerLeave()
          }
        })
        conn.on("close", () => {
          stopHeartbeat()
          dataConn = null
          if (currentCall) handlePartnerLeave()
        })
      }

      function setupCall(call) {
        currentCall = call

        call.on("stream", (remoteStream) => {
          remoteVideo.srcObject = remoteStream
          remoteVideo.style.visibility = "visible"
          statusDisplay.textContent = "Поврзан"
          statusDisplay.style.color = "#4caf50"
        })

        if (call.peerConnection) {
          call.peerConnection.oniceconnectionstatechange = () => {
            const state = call.peerConnection.iceConnectionState
            if (state === "disconnected" || state === "failed" || state === "closed") {
              handlePartnerLeave()
            }
          }
        }

        call.on("close", handlePartnerLeave)
      }

      function handlePartnerLeave() {
        stopHeartbeat()
        if (!currentCall && !dataConn) return
        remoteVideo.srcObject = null
        remoteVideo.style.visibility = "visible"
        if (currentCall) {
          currentCall.close()
          currentCall = null
        }
        if (dataConn) {
          dataConn.close()
          dataConn = null
        }
        const roomName = roomIdInput.value.trim().toLowerCase()
        if (peer && peer.id !== roomName) {
          joinRoom(roomName)
        } else {
          statusDisplay.textContent = "Чекам соговорник..."
          statusDisplay.style.color = "#ffb300"
        }
      }

      function fullCleanup() {
        stopHeartbeat()
        retryBtn.style.display = "none"
        if (dataConn) {
          if (dataConn.open) {
            try {
              dataConn.send({ type: "bye" })
            } catch (e) {}
          }
          dataConn.close()
          dataConn = null
        }
        if (currentCall) {
          currentCall.close()
          currentCall = null
        }
        if (peer) {
          peer.disconnect()
          peer.destroy()
          peer = null
        }
        if (localStream) {
          localStream.getTracks().forEach((t) => t.stop())
          localStream = null
        }
        remoteVideo.srcObject = null
        localVideo.srcObject = null
      }

      hangupBtn.addEventListener("click", () => {
        fullCleanup()
        callScreen.style.display = "none"
        loginScreen.style.display = "block"
      })

      document.addEventListener("visibilitychange", () => {
        if (dataConn && dataConn.open) {
          dataConn.send({ type: "minimized", status: document.hidden })
        }
      })

      window.addEventListener("pagehide", fullCleanup)
      window.addEventListener("beforeunload", fullCleanup)
    </script>
  </body>
</html>

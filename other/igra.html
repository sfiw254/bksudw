<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Тенк Против Авиони</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #111;
        overflow: hidden;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        color: #fff;
        padding: 0;
      }

      #ui-container {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        background: #222;
        border-bottom: 3px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 10;
      }

      #score-display {
        color: #00ff00;
      }

      #lives-display {
        color: #ff3333;
      }

      #btn-fullscreen {
        background: #444;
        border: 1px solid #777;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 5px;
        font-family: inherit;
        cursor: pointer;
      }

      canvas {
        background: linear-gradient(to bottom, #1144aa 0%, #4488ff 70%, #88ccff 85%);
        display: block;
        width: 100%;
        flex-grow: 1;
        height: 0;
        touch-action: none;
      }

      .controls-info {
        width: 100%;
        background: #141414;
        padding: 15px 10px;
        padding-bottom: max(15px, env(safe-area-inset-bottom));
        font-size: 12px;
        color: #777;
        text-align: center;
        border-top: 1px solid #222;
      }

      @media (min-width: 1024px) {
        #btn-fullscreen {
          display: none;
        }

        body {
          justify-content: center;
          padding: 20px;
        }

        #ui-container {
          width: 800px;
          border: 4px solid #555;
          border-bottom: none;
        }

        canvas {
          width: 800px;
          height: 500px;
          flex-grow: 0;
          border: 4px solid #555;
        }

        .controls-info {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <h1>ТЕНК ПРОТИВ АВИОНИ</h1>
    <div id="ui-container">
      <div id="score-display">ПОЕНИ: 0</div>
      <button id="btn-fullscreen" onclick="toggleFullScreen()">📱 ЦЕЛ ЕКРАН</button>
      <div id="lives-display">ЖИВОТИ: ❤️❤️❤️</div>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="controls-info">Контроли: <b>Влечи со прст лево/десно</b> за движење | <b>Допри било каде</b> за пукање</div>
    <script>
      function toggleFullScreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            console.log(err.message)
          })
        } else {
          document.exitFullscreen()
        }
      }

      const canvas = document.getElementById("gameCanvas")
      const ctx = canvas.getContext("2d")
      const scoreDisplay = document.getElementById("score-display")
      const livesDisplay = document.getElementById("lives-display")

      let score = 0,
        lives = 3,
        gameOver = false
      const keys = { left: false, right: false, space: false, spacePressed: false }
      const tank = { x: 0, y: 0, width: 50, height: 30, speed: 6 }

      let bullets = [],
        enemies = [],
        enemyBullets = [],
        particles = []
      let isDragging = false,
        startTouchX = 0,
        startTouchY = 0,
        lastTouchX = 0,
        hasMoved = false
      let moveTouchId = null

      function resizeCanvas() {
        canvas.width = canvas.clientWidth || 800
        canvas.height = canvas.clientHeight || 500
        tank.y = canvas.height - 70
        tank.x = canvas.width / 2 - tank.width / 2
      }

      // === КОНТРОЛИ СО ГЛУВЧЕ (НОВО) ===
      canvas.addEventListener("mousemove", (e) => {
        if (gameOver) return
        const rect = canvas.getBoundingClientRect()
        // Поставување на центарот на тенкот точно каде што е глувчето
        tank.x = e.clientX - rect.left - tank.width / 2

        // Спречување тенкот да излезе од рамките на екранот
        if (tank.x < 0) tank.x = 0
        if (tank.x > canvas.width - tank.width) tank.x = canvas.width - tank.width
      })

      canvas.addEventListener("mousedown", (e) => {
        // Ако е крај на играта, клик за рестарт
        if (gameOver) {
          document.location.reload()
          return
        }
        // Пукање со лев клик
        if (e.button === 0) {
          fireBullet()
        }
      })

      // === КОНТРОЛИ СО ТАСТАТУРА ===
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = true
        if (e.key === "ArrowRight" || e.key === "d") keys.right = true
        if (e.key === " ") keys.space = true
      })
      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = false
        if (e.key === "ArrowRight" || e.key === "d") keys.right = false
        if (e.key === " ") {
          keys.space = false
          keys.spacePressed = false
        }
      })

      // === КОНТРОЛИ ЗА НА ТЕЛЕФОН (TOUCH) ===
      canvas.addEventListener(
        "touchstart",
        (e) => {
          if (gameOver) {
            document.location.reload()
            return
          }

          const touches = e.changedTouches
          if (!isDragging) {
            const touch = touches[0]
            moveTouchId = touch.identifier
            isDragging = true
            hasMoved = false
            startTouchX = touch.clientX
            startTouchY = touch.clientY
            lastTouchX = startTouchX
          } else {
            fireBullet()
          }
        },
        { passive: true }
      )

      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (!isDragging || gameOver) return

          let touch = null
          for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === moveTouchId) {
              touch = e.touches[i]
              break
            }
          }

          if (!touch) return

          const currentTouchX = touch.clientX
          const currentTouchY = touch.clientY

          if (Math.abs(currentTouchX - startTouchX) > 8 || Math.abs(currentTouchY - startTouchY) > 8) {
            hasMoved = true
          }

          tank.x += currentTouchX - lastTouchX
          if (tank.x < 0) tank.x = 0
          if (tank.x > canvas.width - tank.width) tank.x = canvas.width - tank.width

          lastTouchX = currentTouchX
        },
        { passive: true }
      )

      canvas.addEventListener(
        "touchend",
        (e) => {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === moveTouchId) {
              if (!hasMoved) fireBullet()
              isDragging = false
              hasMoved = false
              moveTouchId = null
              break
            }
          }
        },
        { passive: true }
      )

      function fireBullet() {
        if (bullets.length === 0 && !gameOver) {
          bullets.push({ x: tank.x + tank.width / 2 - 3, y: tank.y, width: 6, height: 15, speed: 8 })
        }
      }

      function createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
          particles.push({
            x: x,
            y: y,
            radius: Math.random() * 3 + 1,
            color: color,
            speedX: (Math.random() - 0.5) * 6,
            speedY: (Math.random() - 0.5) * 6,
            alpha: 1,
            decay: Math.random() * 0.03 + 0.02
          })
        }
      }

      function spawnEnemy() {
        if (gameOver) return
        enemies.push({
          x: Math.random() * (canvas.width - 40),
          y: Math.random() * 80 + 30,
          width: 40,
          height: 25,
          speedX: (Math.random() * 2 + 1.5) * (Math.random() < 0.5 ? 1 : -1),
          shootTimer: Math.random() * 100 + 40
        })
        setTimeout(spawnEnemy, 1200)
      }

      function update() {
        if (gameOver) return
        if (keys.left && tank.x > 0) tank.x -= tank.speed
        if (keys.right && tank.x < canvas.width - tank.width) tank.x += tank.speed
        if (keys.space && !keys.spacePressed) {
          fireBullet()
          keys.spacePressed = true
        }

        bullets.forEach((b, i) => {
          b.y -= b.speed
          if (b.y < 0) bullets.splice(i, 1)
        })

        enemies.forEach((e, ei) => {
          e.x += e.speedX
          if (e.x <= 0 || e.x >= canvas.width - e.width) {
            e.speedX *= -1
            e.y += 20
          }
          e.shootTimer--
          if (e.shootTimer <= 0) {
            enemyBullets.push({ x: e.x + e.width / 2 - 3, y: e.y + e.height, width: 6, height: 12, speed: 4 })
            e.shootTimer = Math.random() * 120 + 80
          }
          if (e.y + e.height >= canvas.height - 40) {
            lives = 0
            gameOver = true
          }

          bullets.forEach((b, bi) => {
            if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
              createExplosion(e.x + e.width / 2, e.y + e.height / 2, "#ff5500")
              enemies.splice(ei, 1)
              bullets.splice(bi, 1)
              score += 10
              scoreDisplay.innerText = "ПОЕНИ: " + score
            }
          })
        })

        enemyBullets.forEach((eb, ebi) => {
          eb.y += eb.speed
          if (eb.y > canvas.height) enemyBullets.splice(ebi, 1)
          if (eb.x < tank.x + tank.width && eb.x + eb.width > tank.x && eb.y < tank.y + tank.height && eb.y + eb.height > tank.y) {
            createExplosion(tank.x + tank.width / 2, tank.y + tank.height / 2, "#ff0000")
            enemyBullets.splice(ebi, 1)
            lives--
            if (lives <= 0) {
              livesDisplay.innerText = "ЖИВОТИ: ИЗГУБЕНИ"
              gameOver = true
            } else {
              livesDisplay.innerText = "ЖИВОТИ: " + "❤️".repeat(lives)
            }
          }
        })
        particles.forEach((p, i) => {
          p.x += p.speedX
          p.y += p.speedY
          p.alpha -= p.decay
          if (p.alpha <= 0) particles.splice(i, 1)
        })
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        ctx.fillStyle = "#33aa33"
        ctx.fillRect(0, canvas.height - 40, canvas.width, 10)
        ctx.fillStyle = "#8b5a2b"
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30)
        ctx.fillStyle = "#1e5631"
        ctx.fillRect(tank.x, tank.y + 10, tank.width, 20)
        ctx.fillRect(tank.x + 12, tank.y, tank.width - 24, 10)
        ctx.fillStyle = "#0f381d"
        ctx.fillRect(tank.x + tank.width / 2 - 4, tank.y - 12, 8, 12)
        ctx.fillStyle = "#222"
        ctx.fillRect(tank.x, tank.y + 26, tank.width, 4)
        ctx.fillStyle = "#ffff00"
        bullets.forEach((b) => ctx.fillRect(b.x, b.y, b.width, b.height))
        enemies.forEach((e) => {
          ctx.fillStyle = "#d32f2f"
          ctx.fillRect(e.x, e.y + 5, e.width, 8)
          ctx.fillStyle = "#9a0007"
          ctx.fillRect(e.x + e.width / 2 - 6, e.y, 12, e.height)
          ctx.fillRect(e.x + e.width / 2 - 12, e.y, 24, 4)
        })
        ctx.fillStyle = "#ff1100"
        enemyBullets.forEach((eb) => {
          ctx.beginPath()
          ctx.arc(eb.x + 3, eb.y + 6, 4, 0, Math.PI * 2)
          ctx.fill()
        })
        particles.forEach((p) => {
          ctx.save()
          ctx.globalAlpha = p.alpha
          ctx.fillStyle = p.color
          ctx.beginPath()
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2)
          ctx.fill()
          ctx.restore()
        })
        if (gameOver) {
          ctx.fillStyle = "rgba(0, 0, 0, 0.8)"
          ctx.fillRect(0, 0, canvas.width, canvas.height)
          ctx.fillStyle = "#ff0000"
          ctx.font = "bold 30px 'Courier New'"
          ctx.textAlign = "center"
          ctx.fillText("КРАЈ НА ИГРАТА", canvas.width / 2, canvas.height / 2 - 20)
          ctx.fillStyle = "#ffffff"
          ctx.font = "16px 'Courier New'"
          ctx.fillText("Кликнете или допрете за нова игра", canvas.width / 2, canvas.height / 2 + 30)
        }
      }

      function gameLoop() {
        update()
        draw()
        requestAnimationFrame(gameLoop)
      }

      window.addEventListener("load", () => {
        resizeCanvas()
        window.addEventListener("resize", resizeCanvas)
        spawnEnemy()
        gameLoop()
      })
    </script>
  </body>
</html>
